<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PITO - باڵی هاوڕێیان</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --pito-red: #e61e25; --pito-light: #f2f2f7; --text-dark: #1c1c1e; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: #000; /* ڕەنگی پشتەوە بۆ لاپتۆپ */
            display: flex; justify-content: center;
        }

        /* سنووردارکردنی قەبارە بۆ لاپتۆپ */
        .app-container {
            width: 100%;
            max-width: 450px; /* ڕێک وەک مۆبایل لە لاپتۆپ دەردەکەوێت */
            background-color: var(--pito-red);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            direction: rtl;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* Background */
        .stars-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        .moon { position: absolute; top: 50px; left: 40px; width: 60px; height: 60px; background: #f1f5f9; border-radius: 50%; box-shadow: 0 0 20px #f1f5f9; z-index: 1; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; height: 65px; color: white; position: sticky; top: 0; z-index: 1000; background: var(--pito-red); }
        .header-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 38px; height: 38px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .header-title { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .user-av-top { width: 38px; height: 38px; border-radius: 50%; border: 2px solid white; cursor: pointer; }

        /* Content Sheet */
        .content-sheet { background-color: var(--pito-light); border-radius: 35px 35px 0 0; min-height: 90vh; padding: 20px 15px; margin-top: 5px; padding-bottom: 120px; position: relative; z-index: 10; }

        /* Banner */
        .main-banner { width: 100%; height: 130px; background: #000; border-radius: 25px; margin-bottom: 20px; overflow: hidden; position: relative; }
        .main-banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .banner-label { position: absolute; bottom: 15px; right: 20px; color: white; font-weight: 900; font-size: 16px; }

        /* Game Grid - 3 Columns */
        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .game-card { display: flex; flex-direction: column; align-items: center; text-decoration: none; transition: 0.2s; }
        .game-box { width: 100%; aspect-ratio: 1/1.2; background: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 1px solid #e5e5ea; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 6px; }
        .game-box img { width: 55%; height: auto; }
        .game-name { color: var(--text-dark); font-weight: 800; font-size: 11px; text-align: center; }

        /* Team Lobby View */
        #teamLobbyView { display: none; flex-direction: column; align-items: center; padding-top: 20px; }
        .lobby-display { display: flex; justify-content: center; align-items: flex-end; gap: 20px; margin-bottom: 30px; }
        .player-spot { display: flex; flex-direction: column; align-items: center; }
        .lobby-av { width: 85px; height: 85px; border-radius: 50%; border: 4px solid var(--pito-red); background: white; }
        .spot-empty { border: 2px dashed #ccc; background: #eee; }
        .lobby-name { background: black; color: white; padding: 2px 10px; border-radius: 50px; font-size: 10px; margin-top: 8px; font-weight: bold; }

        /* Bottom Controls */
        .start-btn-large { background: var(--pito-red); color: white; border: none; width: 200px; padding: 15px; border-radius: 15px; font-weight: 900; font-size: 20px; cursor: pointer; box-shadow: 0 10px 20px rgba(230,30,37,0.3); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 450px; height: 70px; background: white; border-top: 1px solid #e5e5ea; display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-link { font-size: 22px; color: #c7c7cc; cursor: pointer; transition: 0.2s; }
        .nav-link.active { color: var(--pito-red); }
        .nav-center { background: var(--pito-red); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 26px; margin-top: -35px; border: 5px solid white; }

        /* Modals & Sidebar */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; display: none; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 90%; max-width: 350px; padding: 25px; border-radius: 30px; position: relative; color: #333; }
        #friendsSidebar { position: fixed; top: 0; left: 0; width: 100%; max-width: 300px; height: 100%; background: white; z-index: 4000; transform: translateX(-100%); transition: 0.3s ease; padding: 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.2); }
        #friendsSidebar.open { transform: translateX(0); }
        
        .friend-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f2f2f7; }
        .friend-av-img { width: 35px; height: 35px; border-radius: 50%; margin-left: 10px; }
        .btn-red-sm { background: var(--pito-red); color: white; border: none; padding: 6px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .toggle-btn { background: #eee; border: none; padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .toggle-btn.on { background: #10b981; color: white; }
    </style>
</head>
<body onclick="startAudio()">

    <div class="app-container">
        <div class="stars-container" id="starsCont"></div>
        <div class="moon"></div>

        <!-- Header -->
        <div class="header">
            <button class="header-btn" onclick="openM('settingsModal')">⚙️</button>
            <div class="header-title">PITO</div>
            <img id="topAvatar" src="" class="user-av-top" onclick="openM('profileModal')">
        </div>

        <!-- Content Area -->
        <div class="content-sheet">
            
            <!-- Normal Mode -->
            <div id="normalView">
                <div class="main-banner">
                    <img src="https://img.freepik.com/free-vector/gaming-background-with-stylish-neon-lights_1017-30377.jpg">
                    <div class="banner-label">باڵی هاوڕێیان</div>
                </div>
                <div class="game-grid">
                    <a href="game1-online.html" class="game-card">
                        <div class="game-box" style="background:#eef2ff;"><img src="https://cdn-icons-png.flaticon.com/512/1023/1023656.png"></div>
                        <div class="game-name">بەخت</div>
                    </a>
                    <a href="game2.html" class="game-card">
                        <div class="game-box" style="background:#fff1f2;"><img src="https://cdn-icons-png.flaticon.com/512/1162/1162251.png"></div>
                        <div class="game-name">زیرەکی</div>
                    </a>
                    <div class="game-card">
                        <div class="game-box" style="opacity:0.4;"><img src="https://cdn-icons-png.flaticon.com/512/141/141044.png"></div>
                        <div class="game-name">مافیا</div>
                    </div>
                </div>
            </div>

            <!-- Team Lobby Mode -->
            <div id="teamLobbyView">
                <div class="lobby-display">
                    <div class="player-spot">
                        <img id="lobbyAv1" src="" class="lobby-av">
                        <div class="lobby-name">تۆ</div>
                    </div>
                    <div class="player-spot">
                        <img id="lobbyAv2" src="" class="lobby-av spot-empty">
                        <div class="lobby-name" id="lobbyN2">...</div>
                    </div>
                </div>
                <div id="selectedMapText" style="margin-bottom:15px; font-weight:bold; color:var(--pito-red);">یارییەک هەڵبژێرە</div>
                <button class="header-btn" style="background:#333; width:160px; margin-bottom:20px; font-size:14px;" onclick="openM('mapModal')">گۆڕینی ماپ 🗺️</button>
                <button id="startTeamGame" class="start-btn-large" onclick="startGameNow()">START 🚀</button>
                <p onclick="leaveTeam()" style="color:#666; font-size:12px; margin-top:20px; cursor:pointer; text-decoration:underline;">تێکشاندنی تیم</p>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-link active" onclick="goHome()">🏠</div>
            <div class="nav-link" onclick="toggleSidebar()">👥</div>
            <div class="nav-center" onclick="openM('mapModal')">+</div>
            <div class="nav-link">🏆</div>
            <div class="nav-link" onclick="openM('profileModal')">👤</div>
        </div>
    </div>

    <!-- Modals -->
    <div id="friendsSidebar">
        <button onclick="toggleSidebar()" class="btn-red-sm" style="width:100%; padding:12px; margin-bottom:20px;">داخستن ✕</button>
        <div style="display:flex; gap:5px; margin-bottom:20px;">
            <input type="text" id="searchInput" placeholder="ناوی وردی هاوڕێ..." style="flex:1; padding:12px; border-radius:12px; border:1px solid #eee; outline:none;">
            <button onclick="searchUser()" style="background:black; color:white; border:none; padding:10px 15px; border-radius:12px;">🔍</button>
        </div>
        <div id="searchResult"></div>
        <div id="friendsList"></div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span style="position:absolute; top:15px; left:15px; font-size:25px; cursor:pointer;" onclick="closeM('settingsModal')">✕</span>
            <h3 style="margin-bottom:20px;">ڕێکخستن</h3>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <span>🎵 میوزیکی پاشبنەما</span>
                <button id="msBtn" class="toggle-btn" onclick="tglMus()">پێکراوە</button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>🔊 دەنگی یاری</span>
                <input type="range" id="vSlide" min="0" max="1" step="0.1" onchange="svSet()">
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span style="position:absolute; top:15px; left:15px; font-size:25px; cursor:pointer;" onclick="closeM('profileModal')">✕</span>
            <h3 style="text-align:center; margin-bottom:20px;">پڕۆفایل</h3>
            <div id="avGrid" class="avatar-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;"></div>
            <button onclick="logout()" style="width:100%; padding:15px; background:#f2f2f7; border:none; border-radius:15px; margin-top:25px; color:red; font-weight:bold; cursor:pointer;">دەرچوون</button>
        </div>
    </div>

    <div id="mapModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center; margin-bottom:20px;">هەڵبژاردنی یاری</h3>
            <div class="game-grid">
                <div onclick="selectGame(1, 'خولانەوەی بەخت')" style="text-align:center; cursor:pointer;">🎰<br><small>یاری ١</small></div>
                <div onclick="selectGame(2, 'پێشبڕکێی زیرەکی')" style="text-align:center; cursor:pointer;">🧠<br><small>یاری ٢</small></div>
            </div>
        </div>
    </div>

    <div id="notification" style="position:fixed; top:20px; left:20px; right:20px; background:#1a1a1a; color:white; padding:15px; border-radius:20px; z-index:5000; display:none;">
        <div id="notifText"></div>
        <button id="notifAccept" style="background:#10b981; color:white; border:none; padding:12px; border-radius:12px; width:100%; margin-top:10px; font-weight:bold;">قبوڵکردن</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAVUxyWwAuY_ZnwjFC9WZp1NVp1l815a4c", authDomain: "yari-online.firebaseapp.com", databaseURL: "https://yari-online-default-rtdb.firebaseio.com", projectId: "yari-online", storageBucket: "yari-online.firebasestorage.app", messagingSenderId: "503368361126", appId: "1:503368361126:web:09028d371b17372e320067" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let curU = localStorage.getItem('currentUser'), curA = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky";
        const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3');
        bgMusic.loop = true; let aStarted = false;
        let currentTeamID = null;

        if(!curU) window.location.href = 'login.html';

        function toggleSidebar() { document.getElementById('friendsSidebar').classList.toggle('open'); }
        function openM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }
        function goHome() { if(currentTeamID) leaveTeam(); else location.reload(); }
        function logout() { localStorage.removeItem('currentUser'); window.location.href='login.html'; }

        function startAudio() { 
            if(!aStarted) { 
                if(localStorage.getItem('music') !== 'off') bgMusic.play().catch(()=>{}); 
                bgMusic.volume = localStorage.getItem('volume') || 0.5;
                aStarted = true; 
            } 
        }

        function tglMus() {
            let m = localStorage.getItem('music') === 'off' ? 'on' : 'off';
            localStorage.setItem('music', m);
            document.getElementById('msBtn').innerText = m === 'on' ? 'پێکراوە' : 'کوژاوەتەوە';
            document.getElementById('msBtn').classList.toggle('on', m === 'on');
            if(m === 'on') bgMusic.play(); else bgMusic.pause();
        }

        function svSet() { localStorage.setItem('volume', document.getElementById('vSlide').value); bgMusic.volume = document.getElementById('vSlide').value; }

        async function searchUser() {
            const n = document.getElementById('searchInput').value.trim();
            if(!n || n===curU) return;
            db.ref('users').orderByChild('name').equalTo(n).once('value', s => {
                const res = document.getElementById('searchResult');
                if(s.exists()){
                    const u = Object.values(s.val())[0];
                    res.innerHTML = `<div class="friend-row"><div><img src="${u.avatar}" class="friend-av-img">${u.name}</div><button class="btn-red-sm" onclick="sendReq('${u.name}')">Add</button></div>`;
                } else res.innerHTML = "<small>نەدۆزرایەوە!</small>";
            });
        }
        async function sendReq(t) { await db.ref(`requests/${t}/${curU}`).set({from:curU, avatar:curA}); alert("داواکاری نێردرا!"); }
        async function acceptReq(id, av) { await db.ref(`friends/${curU}/${id}`).set({ avatar: av }); await db.ref(`friends/${id}/${curU}`).set({ avatar: curA }); await db.ref(`requests/${curU}/${id}`).remove(); }
        
        async function inviteToTeam(tid) { 
            const teamID = "team_"+curU;
            currentTeamID = teamID;
            await db.ref('teams/'+teamID).set({ p1:curU, p1Av:curA, p2:"", p2Av:"", status:'lobby', selectedGame: 0 });
            await db.ref('teamInvites/'+tid).set({ from:curU, teamID: teamID });
            alert("بانگێشت نێردرا!");
        }

        async function acceptTeam(d) {
            await db.ref('teams/'+d.teamID).update({ p2:curU, p2Av:curA });
            await db.ref('teamInvites/'+curU).remove();
            document.getElementById('notification').style.display='none';
        }

        async function selectGame(id, name) { if(currentTeamID) { await db.ref('teams/'+currentTeamID).update({ selectedGame: id, gameName: name }); closeM('mapModal'); } }
        async function startGameNow() { if(currentTeamID) { const rID = Math.random().toString(36).substring(2, 7).toUpperCase(); await db.ref('teams/'+currentTeamID).update({ status: 'gaming', roomID: rID }); setTimeout(() => db.ref('teams/'+currentTeamID).remove(), 2000); } }
        async function leaveTeam() { if(currentTeamID) await db.ref('teams/'+currentTeamID).remove(); location.reload(); }

        function init() {
            document.getElementById('topAvatar').src = curA;
            document.getElementById('lobbyAv1').src = curA;
            document.getElementById('vSlide').value = localStorage.getItem('volume') || 0.5;
            if(localStorage.getItem('music') === 'on') document.getElementById('msBtn').classList.add('on');

            db.ref('users/'+curU).set({name:curU, avatar:curA, status:'online'});
            db.ref('users/'+curU).onDisconnect().remove();

            db.ref('friends/'+curU).on('value', snap => {
                const f = snap.val(); const list = document.getElementById('friendsList'); list.innerHTML = "";
                if(f) for(let id in f) list.innerHTML += `<div class="friend-row"><div><img src="${f[id].avatar}" class="friend-av-img">${id}</div><button class="btn-red-sm" onclick="inviteToTeam('${id}')">Invite</button></div>`;
            });

            db.ref('teamInvites/'+curU).on('value', s => {
                const d = s.val(); if(d) { document.getElementById('notification').style.display='block'; document.getElementById('notifText').innerHTML = d.from + " بانگی کردیت!"; document.getElementById('notifAccept').onclick = () => acceptTeam(d); }
            });

            db.ref('teams').on('value', s => {
                const teams = s.val(); let inT = false;
                for (let id in teams) {
                    const t = teams[id];
                    if (t.p1 === curU || t.p2 === curU) {
                        inT = true; currentTeamID = id;
                        document.getElementById('normalView').style.display = 'none';
                        document.getElementById('teamLobbyView').style.display = 'flex';
                        document.getElementById('lobbyAv2').src = t.p2Av || "";
                        document.getElementById('lobbyAv2').classList.toggle('spot-empty', !t.p2);
                        document.getElementById('lobbyN2').innerText = t.p2 || "چاوەڕێیە...";
                        if(t.selectedGame > 0) document.getElementById('selectedMapText').innerText = "یاری: " + t.gameName;
                        if (t.p1 === curU && t.selectedGame > 0) document.getElementById('startTeamGame').style.display = 'block';
                        if (t.status === 'gaming') window.location.href = `${t.selectedGame===1?'game1-online.html':'game2.html'}?join=${t.roomID}&teamID=${id}`;
                    }
                }
                if(!inT) { document.getElementById('normalView').style.display = 'block'; document.getElementById('teamLobbyView').style.display = 'none'; }
            });

            const g = document.getElementById('avGrid'); g.innerHTML = "";
            for(let i=1; i<=8; i++) {
                let u = `https://api.dicebear.com/7.x/avataaars/svg?seed=P${i+200}`;
                let im = document.createElement('img'); im.src = u; im.className = 'avatar-opt'; im.onclick = () => { localStorage.setItem('userAvatar', u); location.reload(); };
                g.appendChild(im);
            }
        }

        const sCont = document.getElementById('starsCont');
        for(let i=0; i<80; i++) {
            const s = document.createElement('div'); s.className = 'star';
            let sz = Math.random() * 3 + 1; s.style.width = sz + 'px'; s.style.height = sz + 'px';
            s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
            s.style.setProperty('--duration', (Math.random() * 3 + 1.5) + 's');
            sCont.appendChild(s);
        }
        init();
    </script>
</body>
</html>
