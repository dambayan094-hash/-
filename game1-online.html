<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>یاری یەکەم - ئۆنلاین | ماڵی هاوڕیان</title>
<link rel="stylesheet" href="style-common.css">
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<style>
/* شێوازی تایبەتی یاری ئۆنلاین */
.players-panel{display:flex;gap:20px;margin:20px 0;}
.player-card{flex:1;background:#1e293b;border-radius:32px;padding:20px;text-align:center;border:2px solid #facc15;}
.player-card h3{color:#facc15;margin-bottom:10px;}
.player-score{font-size:2rem;font-weight:bold;color:#facc15;}
.slot-machine{background:rgba(0,0,0,0.5);border-radius:40px;padding:15px;border:1px solid #facc15;}
.slot-box{position:relative;height:120px;background:#020617;border-radius:28px;overflow:hidden;}
.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid #facc15;z-index:20;}
.track{display:flex;position:absolute;left:0;top:0;height:100%;will-change:transform;}
.item{min-width:260px;display:flex;justify-content:center;align-items:center;font-size:1rem;font-weight:bold;padding:0 20px;background:#1e293b;color:#e2e8f0;border-right:2px solid #facc15;}
.spin-btn{background:linear-gradient(145deg,#facc15,#eab308);border:none;padding:16px 42px;font-size:1.4rem;font-weight:bold;color:#0f172a;border-radius:60px;cursor:pointer;margin:30px auto 0;display:block;}
.spin-btn:disabled{opacity:0.6;cursor:not-allowed;}
.result-card{background:rgba(0,0,0,0.5);border-radius:28px;padding:18px;margin-top:15px;text-align:center;}
.result-label{font-size:0.8rem;color:#94a3b8;}
.result-value{font-size:1.5rem;font-weight:bold;color:#facc15;}
.status{text-align:center;color:#94a3b8;margin:15px;}
.room-code-box{background:#000;padding:20px;border-radius:32px;margin:20px 0;border:2px solid #facc15;}
.room-code{font-size:2rem;font-weight:bold;color:#facc15;letter-spacing:5px;}
.input-group{display:flex;gap:10px;margin:20px 0;}
.input-group input{flex:1;padding:14px;border-radius:40px;border:none;background:#0a0a0a;color:white;}
.primary-btn{background:#facc15;border:none;padding:12px 25px;border-radius:40px;font-weight:bold;cursor:pointer;}
.secondary-btn{background:#334155;border:none;padding:12px 25px;border-radius:40px;color:white;cursor:pointer;}
.danger-btn{background:#dc2626;border:none;padding:12px 25px;border-radius:40px;color:white;cursor:pointer;}
.timer{text-align:center;margin:15px;font-size:1.2rem;color:#facc15;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="container">
    <a href="index.html" class="back-home">🏠 ← گەڕانەوە</a>
    <div class="user-info" id="userInfo"></div>
    
    <!-- شاشەی دروستکردن/پەیوەستبوون بە ژوور -->
    <div id="roomSection">
        <h1>🎰 یاری خولانەوەی بەخت - ئۆنلاین</h1>
        <div class="sub">ژوورێک دروست بکە یان پەیوەست بە ژووری هاوڕێکەت</div>
        <button class="primary-btn" id="createRoomBtn" style="width:100%;margin:10px 0;">✨ ژووری نوێ دروست بکە</button>
        <div class="input-group">
            <input type="text" id="joinRoomInput" placeholder="کۆدی ژوورەکە بنووسە">
            <button class="secondary-btn" id="joinRoomBtn">🚪 بچە ژوورەوە</button>
        </div>
    </div>
    
    <!-- شاشەی چاوەڕوانی -->
    <div id="waitingSection" style="display:none;">
        <div class="room-code-box">
            <div>📋 کۆدی ژوورەکەت:</div>
            <div class="room-code" id="roomCodeDisplay"></div>
        </div>
        <div class="status" id="waitingStatus">چاوەڕێی یاریزانی دووەم...</div>
        <button class="primary-btn" id="startGameBtn" style="display:none;width:100%;">🎮 دەستپێکردنی یاری</button>
        <button class="danger-btn" id="cancelBtn" style="width:100%;margin-top:10px;">🚪 گەڕانەوە</button>
    </div>
    
    <!-- شاشەی یاری -->
    <div id="gameSection" style="display:none;">
        <div class="players-panel">
            <div class="player-card"><h3 id="player1Name">یاریزانی 1</h3><div class="player-score" id="player1Score">0</div></div>
            <div class="player-card"><h3 id="player2Name">یاریزانی 2</h3><div class="player-score" id="player2Score">0</div></div>
        </div>
        
        <div class="timer" id="turnTimer">⏱️ چاوەڕێی ڕۆڵی تۆ...</div>
        
        <div class="slot-machine">
            <div class="slot-box">
                <div class="pointer"></div>
                <div class="track" id="track"></div>
            </div>
        </div>
        
        <button class="spin-btn" id="spinBtn">🎰 SPIN 🌀</button>
        
        <div class="result-card">
            <div class="result-label">🎯 ئەنجامی خولانەوە</div>
            <div class="result-value" id="result">چاوەڕێی یاری...</div>
        </div>
        
        <div class="status" id="gameStatusMsg"></div>
        <button class="danger-btn" id="leaveGameBtn" style="width:100%;margin-top:15px;">🚪 دەرچون لە یاری</button>
    </div>
</div>

<script src="game1-online.js"></script>
<script>
function genStars(){
    const starCont = document.getElementById('stars');
    for(let i=0;i<160;i++){
        const s=document.createElement('div');s.classList.add('star');
        let sz=Math.random()*3+1;s.style.width=sz+'px';s.style.height=sz+'px';
        s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
        s.style.animationDelay=Math.random()*5+'s';
        s.style.animationDuration=(Math.random()*3+1.5)+'s';
        if(sz>2) s.style.boxShadow='0 0 4px white';
        starCont.appendChild(s);
    }
}
genStars();
</script>
</body>
</html>
