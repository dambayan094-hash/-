<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>باڵی هاوڕێیان - Games</title>
<link rel="apple-touch-icon" href="https://i.ibb.co/LhY0m8S/brain-icon.png">
<link rel="icon" type="image/png" href="https://i.ibb.co/LhY0m8S/brain-icon.png">

<style>
    :root {
        --led-blue: #00d2ff;
        --led-purple: #9d50bb;
        --led-gold: #facc15;
    }

    body {
        margin: 0; padding: 0;
        background: #050a18;
        color: white; font-family: 'Segoe UI', Tahoma, sans-serif;
        min-height: 100vh; overflow-x: hidden; direction: rtl;
    }

    /* Stars Background */
    .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    /* Top Bar */
    .header-bar {
        display: flex; justify-content: space-between; align-items: center;
        padding: 15px 25px; background: rgba(11, 17, 32, 0.9);
        backdrop-filter: blur(15px); border-bottom: 2px solid var(--led-blue);
        box-shadow: 0 0 15px var(--led-blue);
        position: sticky; top: 0; z-index: 100;
    }
    .profile-trigger { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .user-avatar-top { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--led-gold); box-shadow: 0 0 10px var(--led-gold); }
    .settings-btn { font-size: 26px; cursor: pointer; transition: 0.3s; filter: drop-shadow(0 0 5px white); }
    .settings-btn:hover { transform: rotate(90deg); color: var(--led-blue); }

    /* Main Container */
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; text-align: center; }

    /* LED Hero Title */
    .welcome-card {
        background: rgba(15, 23, 42, 0.8);
        border: 3px solid var(--led-blue);
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 40px;
        box-shadow: 0 0 20px var(--led-blue), inset 0 0 10px var(--led-blue);
        animation: led-pulse 2s infinite alternate;
    }
    .welcome-card h1 {
        font-size: 32px; margin: 0;
        text-transform: uppercase; letter-spacing: 2px;
        background: linear-gradient(to right, #fff, var(--led-blue));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px var(--led-blue));
    }

    @keyframes led-pulse {
        from { box-shadow: 0 0 10px var(--led-blue); }
        to { box-shadow: 0 0 25px var(--led-blue), inset 0 0 15px var(--led-blue); }
    }

    /* Games Grid & LED Cards */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; }
    
    .game-card {
        background: rgba(30, 41, 59, 0.5);
        border: 2px solid var(--led-purple);
        border-radius: 30px;
        padding: 40px 20px;
        text-decoration: none; color: white;
        transition: 0.4s;
        display: flex; flex-direction: column; align-items: center;
        position: relative; overflow: hidden;
        box-shadow: 0 0 10px var(--led-purple);
    }
    .game-card:hover {
        transform: translateY(-10px) scale(1.02);
        box-shadow: 0 0 30px var(--led-purple);
        background: rgba(30, 41, 59, 0.8);
        border-color: #fff;
    }
    
    .game-icon-img {
        width: 100px; height: 100px;
        margin-bottom: 20px;
        filter: drop-shadow(0 0 15px rgba(255,255,255,0.5));
    }

    .badge {
        background: var(--led-blue); color: #000;
        font-weight: bold; padding: 5px 15px;
        border-radius: 50px; font-size: 12px; margin-top: 15px;
        box-shadow: 0 0 10px var(--led-blue);
    }

    /* Modals */
    .modal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
        z-index: 200; display: none; justify-content: center; align-items: center;
    }
    .modal-content {
        background: #0f172a; width: 90%; max-width: 400px; padding: 30px;
        border-radius: 30px; border: 2px solid var(--led-gold);
        box-shadow: 0 0 20px var(--led-gold); position: relative;
    }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
    .avatar-opt { width: 100%; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
    .avatar-opt.selected { border-color: var(--led-gold); transform: scale(1.1); box-shadow: 0 0 15px var(--led-gold); }

    .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .toggle-btn { background: #334155; border: none; color: white; padding: 10px 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }
    .toggle-btn.on { background: #10b981; box-shadow: 0 0 10px #10b981; }

    .btn-logout { background: none; color: #f87171; border: 1px solid #e11d48; padding: 12px; border-radius: 50px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; }
    .btn-logout:hover { background: #e11d48; color: white; }
    
    input[type=range] { accent-color: var(--led-blue); cursor: pointer; }
</style>
</head>
<body>

<div class="stars" id="starsCont"></div>

<!-- Top Bar -->
<div class="header-bar">
    <div class="settings-btn" onclick="openM('settingsModal')">⚙️</div>
    <div style="font-weight: bold; font-size: 20px; color: var(--led-blue); filter: drop-shadow(0 0 5px var(--led-blue));"> WELCOME </div>
    <div class="profile-trigger" onclick="openM('profileModal')">
        <span id="topName" style="font-weight: bold; color: var(--led-gold);">...</span>
        <img id="topAvatar" src="" class="user-avatar-top">
    </div>
</div>

<!-- Welcome Section -->
<div class="container">
    <div class="welcome-card">
        <h1>بەخێربێن بۆ باڵی هاوڕێیان</h1>
        <p style="color: #94a3b8; margin-top: 10px;"> زیرەکی و کێبڕکێی هاوڕیان</p>
    </div>

    <!-- Games Grid -->
    <div class="games-grid">
        <!-- Game 1 -->
        <a href="game1-online.html" class="game-card" style="--led-purple: #00f2fe;">
            <img src="https://cdn-icons-png.flaticon.com/512/1023/1023656.png" class="game-icon-img">
            <h2 style="color: var(--led-blue);">یاری یەکەم</h2>
            <p style="color: #94a3b8;">خولانەوەی بەختی هاوڕێیان</p>
            <span class="badge">🎰 ئۆنلاین</span>
        </a>

        <!-- Game 2 -->
        <a href="game2.html" class="game-card" style="--led-purple: #9d50bb;">
            <img src="https://cdn-icons-png.flaticon.com/512/1162/1162251.png" class="game-icon-img">
            <h2 style="color: #e0aaff;">یاری دووەم</h2>
            <p style="color: #94a3b8;">پێشبڕکێی پرسیاری زیرەکی</p>
            <span class="badge">🧠 ٤ یاریزان</span>
        </a>
    </div>
</div>

<!-- Profile Modal -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <button style="position:absolute; top:15px; left:15px; background:none; border:none; color:white; font-size:24px; cursor:pointer;" onclick="closeM('profileModal')">✕</button>
        <h2 style="text-align: center; color: var(--led-gold); margin-bottom: 20px;">پڕۆفایل</h2>
        <div style="text-align: center;">
            <img id="midAvatar" src="" style="width: 100px; height: 100px; border-radius: 50%; border: 3px solid var(--led-gold); box-shadow: 0 0 15px var(--led-gold);">
            <h3 id="midName" style="margin-top: 10px;"></h3>
        </div>
        <p style="font-size: 14px; text-align: center; margin-top: 20px; color: #94a3b8;">Avatar هەڵبژێرە:</p>
        <div class="avatar-grid" id="avGrid"></div>
        <button class="btn-logout" onclick="logout()">🚪 دەرچوون لە ئەکاونت</button>
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content" style="border-color: var(--led-blue); box-shadow: 0 0 20px var(--led-blue);">
        <button style="position:absolute; top:15px; left:15px; background:none; border:none; color:white; font-size:24px; cursor:pointer;" onclick="closeM('settingsModal')">✕</button>
        <h2 style="text-align: center; color: var(--led-blue); margin-bottom: 30px;">ڕێکخستنەکان ⚙️</h2>
        
        <div class="setting-row">
            <span>🎵 میوزیکی پاشبنەما</span>
            <button id="msStatus" class="toggle-btn" onclick="tglMus()">پێکراوە</button>
        </div>
        
        <div class="setting-row">
            <span>🔊 دەنگی کاریگەری</span>
            <input type="range" id="vSlide" min="0" max="1" step="0.1" onchange="svSet()">
        </div>

        <p style="font-size: 11px; color: #475569; text-align: center; margin-top: 40px;">پڕۆژەی تایبەت بە باڵی هاوڕێیان</p>
    </div>
</div>

<script>
    const users = {"مەڕوا":"1234","محمد":"1234","ئەشڕەف":"1234","ژوان":"1234"};
    let curU = localStorage.getItem('currentUser');
    let curA = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky";

    if(!curU || !users[curU]) window.location.href = 'login.html';

    function init() {
        document.getElementById('topName').innerText = curU;
        document.getElementById('midName').innerText = curU;
        document.getElementById('topAvatar').src = curA;
        document.getElementById('midAvatar').src = curA;

        // Settings
        const mS = localStorage.getItem('music') || 'on';
        document.getElementById('msStatus').innerText = (mS === 'on') ? 'پێکراوە' : 'کوژاوەتەوە';
        document.getElementById('msStatus').className = 'toggle-btn ' + (mS === 'on' ? 'on' : '');
        document.getElementById('vSlide').value = localStorage.getItem('volume') || 0.5;

        // Avatars
        const g = document.getElementById('avGrid');
        for(let i=1; i<=8; i++) {
            let u = `https://api.dicebear.com/7.x/avataaars/svg?seed=Player${i+100}`;
            let im = document.createElement('img');
            im.src = u;
            im.className = 'avatar-opt' + (u === curA ? ' selected' : '');
            im.onclick = () => {
                curA = u;
                localStorage.setItem('userAvatar', u);
                document.getElementById('topAvatar').src = u;
                document.getElementById('midAvatar').src = u;
                document.querySelectorAll('.avatar-opt').forEach(x => x.classList.remove('selected'));
                im.classList.add('selected');
            };
            g.appendChild(im);
        }
    }

    function openM(id) { document.getElementById(id).style.display = 'flex'; }
    function closeM(id) { document.getElementById(id).style.display = 'none'; }

    function tglMus() {
        let b = document.getElementById('msStatus');
        let c = localStorage.getItem('music') || 'on';
        let n = (c === 'on') ? 'off' : 'on';
        localStorage.setItem('music', n);
        b.innerText = (n === 'on') ? 'پێکراوە' : 'کوژاوەتەوە';
        b.className = 'toggle-btn ' + (n === 'on' ? 'on' : '');
    }

    function svSet() { localStorage.setItem('volume', document.getElementById('vSlide').value); }
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

    // Stars
    const sC = document.getElementById('starsCont');
    for(let i=0;i<100;i++){
        const s=document.createElement('div'); s.className='star';
        let sz=Math.random()*2+1; s.style.width=sz+'px'; s.style.height=sz+'px';
        s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
        s.style.setProperty('--duration', (Math.random()*3+2)+'s');
        sC.appendChild(s);
    }

    init();
</script>
</body>
</html>
