<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>PITO - چوونەژوورەوە</title>
    <style>
        :root {
            --pito-red: #e61e25;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background-color: var(--pito-red); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; direction: rtl; 
        }

        .login-card { 
            background: white; 
            width: 90%; 
            max-width: 380px; 
            padding: 45px 30px; 
            border-radius: 35px; 
            text-align: center; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2); 
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .logo { 
            font-size: 55px; 
            font-weight: 900; 
            color: var(--pito-red); 
            margin-bottom: 10px; 
            letter-spacing: 3px; 
        }

        .sub-title {
            color: #666;
            font-size: 15px;
            margin-bottom: 30px;
        }

        input { 
            width: 100%; 
            padding: 18px; 
            margin-bottom: 20px; 
            border: 2px solid #f2f2f7; 
            border-radius: 20px; 
            outline: none; 
            font-size: 16px; 
            text-align: center; 
            background: #f2f2f7;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--pito-red);
            background: #fff;
        }

        button { 
            width: 100%; 
            padding: 18px; 
            background: var(--pito-red); 
            color: white; 
            border: none; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 18px; 
            cursor: pointer; 
            transition: 0.2s;
            box-shadow: 0 10px 20px rgba(230,30,37,0.3);
        }

        button:active {
            transform: scale(0.96);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="logo">PITO</div>
        <p class="sub-title">بەخێربێیت بۆ باڵی هاوڕێیان</p>
        
        <input type="text" id="username" placeholder="ناوەکەت لێرە بنووسە..." maxlength="15">
        
        <button onclick="startApp()">دەستپێکردن 🚀</button>
        
        <p class="footer-text">خۆشترین کات لەگەڵ هاوڕێکانت بەسەر ببە</p>
    </div>

    <script>
        function startApp() {
            const nameInput = document.getElementById('username');
            const name = nameInput.value.trim();

            if (name.length < 2) {
                alert("تکایە ناوێک بنووسە کە لە ٢ پیت کەمتر نەبێت");
                return;
            }

            // پاشەکەوتکردنی ناوەکە لەناو مۆبایلەکە
            localStorage.setItem('currentUser', name);

            // ناردنی یاریزانەکە بۆ لاپەڕەی سەرەکی
            window.location.href = 'index.html';
        }

        // ئەگەر یاریزانەکە پێشتر ناوی نووسیبوو، ڕاستەوخۆ بچێتە ناو یاری
        window.onload = function() {
            if (localStorage.getItem('currentUser')) {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
