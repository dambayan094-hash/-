<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title> ماڵی هاوڕێیان</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --pito-red: #e61e25; --pito-light: #f2f2f7; --text-dark: #1c1c1e; --led-blue: #00d2ff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background-color: var(--pito-red); overflow-x: hidden; direction: rtl; display: flex; justify-content: center; min-height: 100vh; }

        /* 📱 Responsive Container */
        .app-wrapper {
            width: 100%; max-width: 500px; background-color: var(--pito-red);
            min-height: 100vh; position: relative; display: flex; flex-direction: column;
            box-shadow: 0 0 60px rgba(0,0,0,0.5);
        }

        /* Background Effects */
        .stars-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        .moon { position: absolute; top: 60px; left: 30px; width: 45px; height: 45px; background: #f1f5f9; border-radius: 50%; box-shadow: 0 0 20px #f1f5f9; z-index: 1; opacity: 0.7; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Header */
        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 20px; height: 65px; color: white; position: sticky; top: 0; z-index: 1000; background: var(--pito-red);
        }
        .header-btn { background: rgba(255,255,255,0.2); border: none; color: white; width: 38px; height: 38px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .logo-text { font-size: 26px; font-weight: 900; letter-spacing: 2px; }
        .header-right { display: flex; align-items: center; gap: 8px; }
        .user-av-top { width: 38px; height: 38px; border-radius: 50%; border: 2px solid white; cursor: pointer; background: #fff; }

        /* Content Sheet */
        .content-sheet { 
            background-color: white; border-radius: 35px 35px 0 0; 
            flex: 1; padding: 20px 12px; margin-top: 5px; position: relative; z-index: 10;
            padding-bottom: 120px; box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
        }

        /* Movie Poster Style Game Grid */
        .section-title { font-weight: 800; font-size: 15px; margin-bottom: 15px; color: #444; text-align: right; }
        .game-list { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .game-card { display: flex; flex-direction: column; text-decoration: none; position: relative; transition: 0.3s; }
        .poster-box { 
            width: 100%; aspect-ratio: 16/9; background: #222; border-radius: 20px; 
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #eee;
        }
        .poster-box img { width: 100%; height: 100%; object-fit: cover; }
        .poster-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
            padding: 20px 15px 10px 15px; text-align: right;
        }
        .game-name-label { color: white; font-weight: 900; font-size: 18px; }

        /* 👥 Team Lobby Bar (PUBG Style) */
        #teamLobbyView { display: none; flex-direction: column; align-items: center; padding-top: 20px; }
        .lobby-display { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 40px; width: 100%; }
        .player-spot { display: flex; flex-direction: column; align-items: center; }
        .lobby-av { width: 75px; height: 75px; border-radius: 50%; border: 3px solid var(--pito-red); background: white; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .spot-empty { border: 2px dashed #ccc !important; background: #eee !important; box-shadow: none !important; }
        .lobby-name { background: black; color: white; padding: 2px 8px; border-radius: 50px; font-size: 9px; margin-top: 10px; font-weight: bold; width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }

        .start-btn-large { background: var(--pito-red); color: white; border: none; width: 220px; padding: 15px; border-radius: 15px; font-weight: 900; font-size: 22px; cursor: pointer; box-shadow: 0 10px 20px rgba(230,30,37,0.3); }

        /* 🧭 Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 500px; height: 75px; background: white; 
            border-top: 1px solid #e5e5ea; display: flex; justify-content: space-around; align-items: center; z-index: 1200;
        }
        .nav-link { font-size: 24px; color: #c7c7cc; cursor: pointer; }
        .nav-link.active { color: var(--pito-red); }
        .nav-center { background: var(--pito-red); width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; margin-top: -40px; border: 5px solid white; box-shadow: 0 5px 15px rgba(230,30,37,0.3); }

        /* Modals & Sidebar */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: white; width: 92%; max-width: 380px; padding: 25px; border-radius: 30px; position: relative; color: #333; }
        .close-x { position: absolute; top: 15px; left: 15px; font-size: 25px; cursor: pointer; color: #bbb; }
        
        #friendsSidebar { position: fixed; top: 0; left: 0; width: 300px; height: 100%; background: white; z-index: 4000; transform: translateX(-100%); transition: 0.4s ease; padding: 25px; box-shadow: 10px 0 40px rgba(0,0,0,0.1); }
        #friendsSidebar.open { transform: translateX(0); }
        .friend-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f2f2f7; color: #333; }
        .friend-av-small { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #eee; margin-left: 10px; }
        
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: #10b981; box-shadow: 0 0 5px #10b981; }
        .offline { background: #999; }

        .btn-red-sm { background: var(--pito-red); color: white; border: none; padding: 6px 12px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 11px; }
        .avatar-opt { width: 55px; height: 55px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .avatar-opt.selected { border-color: var(--pito-red); transform: scale(1.1); }
    </style>
</head>
<body id="mainBody" onclick="startAudio()">

    <div class="app-wrapper">
        <div class="stars-container" id="starsCont"></div>
        <div class="moon"></div>

        <!-- Header -->
        <div class="header">
            <button class="header-btn" onclick="openM('settingsModal')">⚙️</button>
            <div class="logo-text">ماڵی هاوڕیان</div>
            <div class="header-right">
                <img id="topAvatar" src="" class="user-av-top" onclick="openM('profileModal')">
            </div>
        </div>

        <!-- Main Sheet -->
        <div class="main-sheet">
            <!-- Normal Mode (Game List) -->
            <div id="normalView">
                <p class="section-title">یارییە هەڵبژێردراوەکان</p>
                <div class="game-list">
                    <a href="game1-online.html" class="game-card">
                        <div class="poster-box"><img src="img2.png"><div class="poster-overlay"><div class="game-name-label">خولانەوەی بەخت</div></div></div>
                    </a>
                    <a href="game2.html" class="game-card">
                        <div class="poster-box"><img src="img1.png"><div class="poster-overlay"><div class="game-name-label">پرسیار و وەڵام</div></div></div>
                    </a>
                    <a href="#" class="game-card" style="opacity: 0.6;">
                        <div class="poster-box"><img src="img3.png"><div class="poster-overlay"><div class="game-name-label">یاری کارتەکان</div></div></div>
                    </a>
                </div>
            </div>

            <!-- Team Lobby Mode (4 Spots) -->
            <div id="teamLobbyView">
                <div class="lobby-display">
                    <div class="player-spot"><img id="l-av1" src="" class="lobby-av"><div class="lobby-name">تۆ</div></div>
                    <div class="player-spot"><img id="l-av2" src="" class="lobby-av spot-empty"><div class="lobby-name" id="l-n2">خاڵی</div></div>
                    <div class="player-spot"><img id="l-av3" src="" class="lobby-av spot-empty"><div class="lobby-name" id="l-n3">خاڵی</div></div>
                    <div class="player-spot"><img id="l-av4" src="" class="lobby-av spot-empty"><div class="lobby-name" id="l-n4">خاڵی</div></div>
                </div>
                <div id="teamGameLabel" style="text-align:center; color:#e61e25; font-weight:bold; margin-bottom:15px; font-size:14px;">یارییەک هەڵبژێرە</div>
                <button class="header-btn" style="background:black; width:180px; margin-bottom:20px; font-size:14px;" onclick="openM('mapModal')">گۆڕینی ماپ 🗺️</button>
                <button id="realStartBtn" class="start-btn-large" onclick="startGameNow()">START 🚀</button>
                <button style="background:none; color:#666; border:none; text-decoration:underline; font-size:12px; cursor:pointer; margin-top:20px;" onclick="leaveTeam()">تێکشاندنی تیم</button>
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <div class="nav-link active" onclick="location.reload()">🏠</div>
            <div class="nav-link" onclick="toggleSidebar()">👥</div>
            <div class="nav-center" onclick="openM('mapModal')">+</div>
            <div class="nav-link" onclick="openM('profileModal')">👤</div>
            <div class="nav-link" onclick="logout()">🚪</div>
        </div>
    </div>

    <!-- Modals -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeM('settingsModal')">✕</span>
            <h3 style="margin-bottom:20px; text-align:center;">ڕێکخستنەکان</h3>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <span>🎵 میوزیکی پاشبنەما</span>
                <button id="msBtn" onclick="tglMus()" style="background:#eee; border:none; padding:10px; border-radius:10px; font-weight:bold;">پێکراوە</button>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span>🔊 دەنگی یاری</span>
                <input type="range" id="vSlide" min="0" max="1" step="0.1" onchange="svSet()">
            </div>
        </div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeM('profileModal')">✕</span>
            <h3 style="text-align:center; margin-bottom:10px;">پڕۆفایل</h3>
            <p style="text-align:center; font-weight:bold; color:var(--pito-red); margin-bottom:15px;" id="midName"></p>
            <div id="avGrid" class="avatar-grid"></div>
            <button onclick="logout()" style="width:100%; padding:15px; background:#fff1f2; border:none; border-radius:15px; margin-top:20px; color:red; font-weight:bold;">Logout</button>
        </div>
    </div>

    <div id="mapModal" class="modal">
        <div class="modal-content">
            <span class="close-x" onclick="closeM('mapModal')">✕</span>
            <h3 style="text-align:center; margin-bottom:20px;">Maps</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div onclick="selectGame(1, 'خولانەوەی بەخت')" style="background:#f2f2f7; padding:15px; border-radius:15px; cursor:pointer; text-align:center;">🎰 بەخت</div>
                <div onclick="selectGame(2, 'پێشبڕکێی زیرەکی')" style="background:#f2f2f7; padding:15px; border-radius:15px; cursor:pointer; text-align:center;">🧠 زیرەکی</div>
            </div>
        </div>
    </div>

    <div id="friendsSidebar">
        <button onclick="toggleSidebar()" class="start-btn-large" style="width:100%; padding:10px; margin-bottom:20px; background:black;">داخستن ✕</button>
        <div style="display:flex; gap:5px; margin-bottom:20px;">
            <input type="text" id="searchInput" placeholder="ناوی هاوڕێ..." style="flex:1; padding:12px; border-radius:12px; border:1px solid #eee; outline:none;">
            <button onclick="searchUser()" class="header-btn" style="background:black; color:white; border-radius:12px;">🔍</button>
        </div>
        <div id="searchResult"></div>
        <div id="friendsList"></div>
    </div>

    <div id="notification" style="position:fixed; top:20px; left:20px; right:20px; background:#111; color:#fff; padding:15px; border-radius:20px; z-index:5000; display:none; border:1px solid var(--pito-red);">
        <div id="notifText"></div>
        <button id="notifAccept" style="background:#10b981; color:white; border:none; padding:12px; border-radius:12px; width:100%; margin-top:10px; font-weight:bold;">قبوڵکردن</button>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAVUxyWwAuY_ZnwjFC9WZp1NVp1l815a4c", authDomain: "yari-online.firebaseapp.com", databaseURL: "https://yari-online-default-rtdb.firebaseio.com", projectId: "yari-online", storageBucket: "yari-online.firebasestorage.app", messagingSenderId: "503368361126", appId: "1:503368361126:web:09028d371b17372e320067" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let curU = localStorage.getItem('currentUser'), curA = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky";
        const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3');
        bgMusic.loop = true; let aStarted = false; let currentTeamID = null;

        if(!curU) window.location.href = 'login.html';

        function openM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }
        function toggleSidebar() { document.getElementById('friendsSidebar').classList.toggle('open'); }
        function logout() { localStorage.clear(); window.location.href='login.html'; }
        function startAudio() { if(!aStarted) { if(localStorage.getItem('music') !== 'off') bgMusic.play().catch(()=>{}); aStarted = true; } }
        function tglMus() { let m = localStorage.getItem('music') === 'off' ? 'on' : 'off'; localStorage.setItem('music', m); document.getElementById('msBtn').innerText = m === 'on' ? 'پێکراوە' : 'کوژاوەتەوە'; if(m === 'on') bgMusic.play(); else bgMusic.pause(); }
        function svSet() { localStorage.setItem('volume', document.getElementById('vSlide').value); bgMusic.volume = document.getElementById('vSlide').value; }

        async function searchUser() {
            const n = document.getElementById('searchInput').value.trim();
            if(!n || n===curU) return;
            db.ref('users').orderByChild('name').equalTo(n).once('value', s => {
                const res = document.getElementById('searchResult');
                if(s.exists()){
                    const u = Object.values(s.val())[0];
                    const st = u.status === 'online' ? '<span class="status-dot online"></span>' : '<span class="status-dot offline"></span>';
                    res.innerHTML = `<div class="friend-row"><div><img src="${u.avatar}" class="friend-av-small">${u.name} ${st}</div><button class="btn-red-sm" onclick="sendReq('${u.name}')">Add</button></div>`;
                } else res.innerHTML = "<small>نەدۆزرایەوە!</small>";
            });
        }
        async function sendReq(t) { await db.ref(`requests/${t}/${curU}`).set({from:curU, avatar:curA}); alert("نێردرا!"); }
        async function acceptReq(id, av) { await db.ref(`friends/${curU}/${id}`).set({ avatar: av }); await db.ref(`friends/${id}/${curU}`).set({ avatar: curA }); await db.ref(`requests/${curU}/${id}`).remove(); }
        
        async function inviteToTeam(tid) { 
            const teamID = currentTeamID || "team_"+curU; currentTeamID = teamID;
            await db.ref('teams/'+teamID).set({ p1:curU, p1Av:curA, p2:"", p3:"", p4:"", status:'lobby', selectedGame: 0 });
            await db.ref('teamInvites/'+tid).set({ from:curU, teamID: teamID });
        }
        async function acceptTeam(d) {
            const teamSnap = await db.ref('teams/'+d.teamID).get();
            if(teamSnap.exists()){
                const team = teamSnap.val();
                let slot = team.p2===""?"p2":(team.p3===""?"p3":(team.p4===""?"p4":""));
                if(slot){ await db.ref(`teams/${d.teamID}/${slot}`).set(curU); await db.ref(`teams/${d.teamID}/${slot}Av`).set(curA); }
            }
            await db.ref('teamInvites/'+curU).remove();
            document.getElementById('notification').style.display='none';
        }

        async function selectGame(id, name) { if(currentTeamID) { await db.ref('teams/'+currentTeamID).update({ selectedGame: id, gameName: name }); closeM('mapModal'); } }
        async function startGameNow() { if(currentTeamID) { const rID = Math.random().toString(36).substring(2, 7).toUpperCase(); await db.ref('teams/'+currentTeamID).update({ status: 'gaming', roomID: rID }); } }
        async function leaveTeam() { if(currentTeamID) await db.ref('teams/'+currentTeamID).remove(); location.reload(); }

        function init() {
            document.getElementById('topAvatar').src = curA;
            document.getElementById('midAvatar').src = curA;
            document.getElementById('midName').innerText = curU;
            document.getElementById('l-av1').src = curA;
            
            const userRef = db.ref('users/'+curU);
            db.ref(".info/connected").on("value", s => { if(s.val()) { userRef.onDisconnect().update({status:'offline'}); userRef.update({name:curU, avatar:curA, status:'online'}); } });

            db.ref('friends/'+curU).on('value', snap => {
                const f = snap.val(); const list = document.getElementById('friendsList'); list.innerHTML = "";
                if(f) for(let id in f) {
                    db.ref('users/'+id).once('value', us => {
                        const u = us.val();
                        const st = u.status === 'online' ? '<span class="status-dot online"></span>' : '<span class="status-dot offline"></span>';
                        list.innerHTML += `<div class="friend-row"><div><img src="${u.avatar}" class="f-av-sm">${id} ${st}</div><button class="btn-red-sm" onclick="inviteToTeam('${id}')">Invite</button></div>`;
                    });
                }
            });

            db.ref('teamInvites/'+curU).on('value', s => { const d = s.val(); if(d) { document.getElementById('notification').style.display='block'; document.getElementById('notifText').innerHTML = d.from + " بانگی کردیت!"; document.getElementById('notifAccept').onclick = () => acceptTeam(d); } });
            
            db.ref('teams').on('value', s => {
                const teams = s.val(); let inT = false;
                for (let id in teams) {
                    const t = teams[id];
                    if (t.p1 === curU || t.p2 === curU || t.p3 === curU || t.p4 === curU) {
                        inT = true; currentTeamID = id; document.getElementById('normalView').style.display = 'none'; document.getElementById('teamLobbyView').style.display = 'flex';
                        for(let i=1; i<=4; i++){
                            const av = t["p"+i+"Av"]; const name = t["p"+i];
                            document.getElementById('l-av'+i).src = av || "https://api.dicebear.com/7.x/avataaars/svg?seed=empty";
                            document.getElementById('l-av'+i).classList.toggle('spot-empty', !name);
                            if(document.getElementById('l-n'+i)) document.getElementById('l-n'+i).innerText = name || "خاڵی";
                        }
                        if(t.selectedGame > 0) document.getElementById('teamGameLabel').innerText = "یاری: " + t.gameName;
                        if (t.p1 === curU && t.selectedGame > 0) document.getElementById('realStartBtn').style.display = 'block';
                        if (t.status === 'gaming') window.location.href = `${t.selectedGame===1?'game1-online.html':'game2.html'}?join=${t.roomID}&teamID=${id}`;
                    }
                }
                if (!inT) { document.getElementById('normalView').style.display = 'block'; document.getElementById('teamLobbyView').style.display = 'none'; }
            });

            const g = document.getElementById('avGrid'); g.innerHTML = "";
            for(let i=1; i<=8; i++) {
                let u = `https://api.dicebear.com/7.x/avataaars/svg?seed=Avatar${i+500}`;
                let im = document.createElement('img'); im.src=u; im.className='avatar-opt'; im.onclick=()=>{ localStorage.setItem('userAvatar',u); location.reload(); };
                g.appendChild(im);
            }
        }
        init();
        for(let i=0; i<80; i++) { const s = document.createElement('div'); s.className = 'star'; let sz = Math.random() * 3 + 1; s.style.width = sz + 'px'; s.style.height = sz + 'px'; s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.setProperty('--duration', (Math.random() * 3 + 1.5) + 's'); document.getElementById('starsCont').appendChild(s); }
    </script>
</body>
</html>
