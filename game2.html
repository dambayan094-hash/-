<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <style>
        :root { --led-blue: #00d2ff; --led-gold: #facc15; --led-purple: #9d50bb; }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body { margin: 0; padding: 15px; background: #050a18; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow: hidden; direction: rtl; display: flex; justify-content: center; align-items: center; }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        .game-card { background-color: rgba(11, 17, 32, 0.96); border: 2px solid var(--led-blue); border-radius: 30px; padding: 25px; box-shadow: 0 0 30px var(--led-blue); position: relative; z-index: 10; width: 100%; max-width: 550px; min-height: 250px; }
        .back-home-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--led-blue); color: white; padding: 8px 20px; border-radius: 50px; cursor: pointer; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 20px; }
        .score-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        @media (min-width: 480px) { .score-container { grid-template-columns: repeat(4, 1fr); } }
        .score-box { border: 2px solid #334155; border-radius: 18px; padding: 10px; text-align: center; background: rgba(255,255,255,0.02); transition: 0.3s; }
        .score-box.active { border-color: var(--led-gold); box-shadow: 0 0 15px var(--led-gold); }
        .player-avatar { width: 45px; height: 45px; border-radius: 50%; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.1); background: #1e293b; }
        .question-area { border: 2px solid var(--led-gold); border-radius: 25px; padding: 20px; margin-bottom: 20px; position: relative; background: rgba(0,0,0,0.3); }
        .timer-box { text-align:center; font-size:26px; font-weight:bold; color:var(--led-gold); margin-bottom:10px; }
        .option-btn { width: 100%; background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 15px; border-radius: 50px; cursor: pointer; margin: 6px 0; font-family: inherit; font-size: 15px; transition: 0.2s; }
        .option-btn.selected { background: var(--led-blue); color: white; border-color: white; box-shadow: 0 0 10px var(--led-blue); }
        .option-btn.correct { background: #166534 !important; border-color: #4ade80 !important; color: white; }
        .option-btn.wrong { background: #991b1b !important; border-color: #f87171 !important; color: white; }
        .action-btn { width: 100%; padding: 16px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; background: var(--led-blue); color: #000; font-size: 16px; margin-top: 10px; }
        #countdownOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,17,32,0.98); border-radius: 25px; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; }
        #cdText { color: var(--led-gold); font-weight: bold; margin-bottom: 10px; font-size: 18px; }
        #cdNum { font-size: 28px; font-weight: bold; color: white; }
        #statusLoader { text-align: center; color: var(--led-blue); padding: 40px; font-weight: bold; }
    </style>
</head>
<body onclick="initAudio()">

            <button class="action-btn" style="background:#e11d48; color:white;" onclick="location.href='index.html'">📕 دەرچوون</button>

        {text:"کام گیانلەبەر بە پێیەکانی تام دەکات؟",options:["مێش","پەپوولە","مێشوولە","هەنگ"],correct:1},
        {text:"پایتەختی بەریتانیا کامەیە؟",options:["لەندەن","پاریس","بەرلین","ڕۆما"],correct:0},
        {text:"کام میوە بە 'پاشای میوەکان' ناسراوە؟",options:["سێو","مانگۆ","هەنار","پرتەقاڵی"],correct:1},
        {text:"چەند ساڵ تەمەنی سەدەیەکە؟",options:["١٠","٥٠","١٠٠","١٠٠٠"],correct:2},
        {text:"کێ داهێنەری ئۆتۆمبێل بوو؟",options:["هێنری فۆرد","کارڵ بێنز","تێسلا","دایملەر"],correct:1},
        {text:"پایتەختی یۆنان کامەیە؟",options:["ڕۆما","ئەتینا","مەدرید","پاریس"],correct:1},
        {text:"کامە گەورەترین دەریاچەی جیهانە؟",options:["دەریاچەی ڤیکتۆریا","دەریای کاسپیەن","دەریاچەی سوپەریۆر","دەریای مردوو"],correct:1},
        {text:"چەند پارێزگا لە هەرێمی کوردستان هەیە؟",options:["٣","٤","٥","٦"],correct:1},
        {text:"کام وڵات زۆرترین گەنمی هەیە؟",options:["ڕووسیا","ئەمریکا","چین","کەنەدا"],correct:2},
        {text:"پایتەختی سووریا کامەیە؟",options:["حەما","حەلەب","دیمەشق","حومس"],correct:2},
        {text:"کامە تاقە ئاژەڵە کە ناخەوێت؟",options:["مێروولە","کۆسە","دۆلفین","زەڕافە"],correct:0},
        {text:"چەند ڕۆژ لە مانگی شوباتدا هەیە لە ساڵێکی ئاساییدا؟",options:["٢٧","٢٨","٢٩","٣٠"],correct:1},
        {text:"کێ نووسەری ڕۆمانی 'مەم و زین'ە؟",options:["نالی","هێمن","ئەحمەدی خانی","قانع"],correct:2},
        {text:"پایتەختی سویسرا کامەیە؟",options:["جنێف","زوریخ","بێرن","لۆزان"],correct:2},
        {text:"کام شار بە 'پایتەختی ڕۆشنبیری' کوردستان ناسراوە؟",options:["هەولێر","دهۆک","سلێمانی","کەرکووک"],correct:2},
        {text:"گەورەترین تەلەسکۆپی جیهان کامەیە؟",options:["هابڵ","جەیمس وێب","ناسا","کێپلەر"],correct:1},
        {text:"کام وڵات بە 'وڵاتی کانگۆ' ناسراوە؟",options:["ئەفریقای باشوور","کەینیا","جەزائیر","کۆماری دیموکراسی کانگۆ"],correct:3},
        {text:"چەند سەکۆ هەیە لە یاری شەترەنجدا؟",options:["٣٢","٤٨","٦٤","٨٠"],correct:2},
        {text:"کام وڵات پایتەختەکەی 'ئۆسلۆ'یە؟",options:["سوید","دانیمارک","نەرویج","فینلەندا"],correct:2},
        {text:"کۆنترین شارستانیەتی عێراق کامەیە؟",options:["بابلی","ئاشووری","سۆمەری","ئەکەدی"],correct:2},
        {text:"پایتەختی مەغریب کامەیە؟",options:["کازابلانکا","ڕەبات","مەراکش","تەنجە"],correct:1},
        {text:"کام وڵات بە 'وڵاتی هەزار دەریاچە' ناسراوە؟",options:["کەنەدا","سوید","فینلەندا","ڕووسیا"],correct:2},
        {text:"چەند ساڵ جارێک یارییەکانی ئۆڵۆمپیاد ئەنجام دەدرێت؟",options:["٢","٣","٤","٥"],correct:2},
        {text:"کام گیاندار تاقە ئاژەڵە ناتوانێت باز بدات؟",options:["زەڕافە","فیل","کەرکەدەن","ورچی جەمسەری"],correct:1},
        {text:"پایتەختی ئیمارات کامەیە؟",options:["دوبەی","شارجه","ئەبوزەبی","عەجمان"],correct:2},
        {text:"کام وڵات بە 'وڵاتی تاتار' ناسراوە؟",options:["ڕووسیا","مەنگۆلیا","تورکیا","ئۆزبەکستان"],correct:1}
    ];

    let curU = localStorage.getItem('currentUser'), curAv = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky", curRoom = null, pNum = null, isL = false, lastQ = -1, lastRE = false;

    window.addEventListener('load', async () => {
        const params = new URLSearchParams(window.location.search);
        const joinId = params.get('join');
        const teamID = params.get('teamID');
        if (joinId) {
            document.getElementById('roomSection').style.display = 'none';
            document.getElementById('statusLoader').style.display = 'block';
            if(teamID) db.ref('teams/'+teamID).remove();
            await handleAutoJoin(joinId);
        }
    });

    async function handleAutoJoin(id) {
        const s = await db.ref('rooms/'+id).get();
        if (!s.exists()) {
            await db.ref('rooms/'+id).set({ p1:curU, p1Score:0, a1:-1, p1Av:curAv, p2:"", p2Score:0, a2:-1, p2Av:"", p3:"", p4:"", status:'waiting', qIndex:0, timeLeft:30, roundEnded:false });
            pNum = 1;
        } else {
            let r = s.val();
            if(r.p1 === curU) pNum = 1;
            else if(r.p2 === curU) pNum = 2;
            else if(r.p3 === curU) pNum = 3;
            else if(r.p4 === curU) pNum = 4;
            else {
                let slot = r.p2===""?"p2":(r.p3===""?"p3":(r.p4===""?"p4":""));
                if(slot) { pNum = parseInt(slot[1]); await db.ref('rooms/'+id+'/'+slot).set(curU); await db.ref('rooms/'+id+'/'+slot+'Av').set(curAv); }
                else { alert("پڕە"); return location.href='index.html'; }
            }
        }
        curRoom = id;
        document.getElementById('statusLoader').style.display = 'none';
        listenR(id);
    }

    async function createR() { const id = Math.random().toString(36).substring(2, 7).toUpperCase(); curRoom = id; pNum = 1; await db.ref('rooms/'+id).set({ p1:curU, p1Score:0, a1:-1, p1Av:curAv, p2:"", p2Score:0, a2:-1, p2Av:"", p3:"", p3Score:0, a3:-1, p3Av:"", p4:"", p4Score:0, a4:-1, p4Av:"", status:'waiting', qIndex:0, timeLeft:30, roundEnded:false }); listenR(id); }
    async function joinR() { const id = document.getElementById('joinIn').value.toUpperCase(); if(id) handleAutoJoin(id); }

    function listenR(id) {
        document.getElementById('roomSection').style.display = 'none';
        document.getElementById('waitingSection').style.display = 'block';
        document.getElementById('codeDisp').innerText = id;
        db.ref('rooms/'+id).on('value', snap => {
            const r = snap.val(); if(!r) return;
            const pL = document.getElementById('playerList'); pL.innerHTML = "";
            [1,2,3,4].forEach(i => { if(r["p"+i]) pL.innerHTML += `<div class="score-box active"><img src="${r['p'+i+'Av'] || curAv}" class="player-avatar"><br><span style="font-size:10px;">${r["p"+i]}</span></div>`; });
            if(pNum===1 && r.p2) document.getElementById('startBtn').style.display = 'block';
            if(r.status==='playing') startA();
            if(r.status==='ended') showF(r);
        });
    }

    function startG() { db.ref('rooms/'+curRoom).update({status:'playing'}); }

    function startA() {
        document.getElementById('waitingSection').style.display = 'none';
        document.getElementById('gameSection').style.display = 'block';
        db.ref('rooms/'+curRoom).on('value', snap => {
            const r = snap.val(); if(!r || r.status!=='playing') return;
            if(r.roundEnded && !lastRE) { playS(winS); showO(r); }
            lastRE = r.roundEnded;
            updateUI(r);
            if(pNum===1 && !r.roundEnded && !isL) {
                let all = (r.a1!==-1) && (r.p2==="" || r.a2!==-1) && (r.p3==="" || r.a3!==-1) && (r.p4==="" || r.a4!==-1);
                if(all && r.timeLeft>5) db.ref('rooms/'+curRoom).update({timeLeft:5});
                if(r.timeLeft<=0) { isL=true; handleRE(r); }
            }
        });
        if(pNum===1) { if(window.timerSet) clearInterval(window.timerSet); window.timerSet = setInterval(async () => { const s = await db.ref('rooms/'+curRoom).get(); const r = s.val(); if(r && r.status==='playing' && !r.roundEnded && r.timeLeft > 0) db.ref('rooms/'+curRoom).update({timeLeft:r.timeLeft-1}); }, 1000); }
    }

    function updateUI(r) {
        const tD = document.getElementById('timerDisp');
        if(tD.innerText != r.timeLeft && r.timeLeft>0 && !r.roundEnded) playS(tickS);
        tD.innerText = r.timeLeft;
        const sB = document.getElementById('scoreBoard'); sB.innerHTML = "";
        [1,2,3,4].forEach(i => { if(r["p"+i]) sB.innerHTML += `<div class="score-box ${(r['a'+i]!==-1 && !r.roundEnded)?'active':''}"><img src="${r['p'+i+'Av'] || curAv}" class="player-avatar"><div>${r["p"+i]}</div><div style="font-size:20px; font-weight:bold;">${r["p"+i+"Score"]}</div></div>`; });
        const q = questions[r.qIndex];
        if(lastQ !== r.qIndex || r.roundEnded) {
            document.getElementById('qText').innerText = q.text;
            const c = document.getElementById('optionsCont'); c.innerHTML = "";
            q.options.forEach((opt, i) => {
                const b = document.createElement('button'); b.className = 'option-btn'; b.innerText = `${['A','B','C','D'][i]} - ${opt}`;
                if(r["a"+pNum]===i) b.classList.add('selected');
                b.disabled = r["a"+pNum]!==-1 || r.roundEnded;
                if(r.roundEnded) { if(i===q.correct) b.classList.add('correct'); else if(i===r["a"+pNum]) b.classList.add('wrong'); }
                b.onclick = () => { playS(tickS); b.classList.add('selected'); db.ref('rooms/'+curRoom+'/a'+pNum).set(i); };
                c.appendChild(b);
            });
            if(!r.roundEnded) { lastQ = r.qIndex; document.getElementById('countdownOverlay').style.display='none'; }
        }
    }

    function showO(r) {
        const o = document.getElementById('countdownOverlay'); const ct = document.getElementById('cdText'); const cn = document.getElementById('cdNum');
        o.style.display = 'flex'; ct.innerText = "وەڵامی ڕاست:"; cn.innerText = questions[r.qIndex].options[questions[r.qIndex].correct];
        setTimeout(() => {
            ct.innerText = "ئامادەبە!"; let count = 5; cn.innerText = count;
            let int = setInterval(() => { count--; if(count>0) { cn.innerText=count; playS(tickS); } else clearInterval(int); }, 1000);
        }, 2500);
    }

    async function handleRE(r) {
        let ups = { roundEnded: true };
        [1,2,3,4].forEach(i => { if(r["p"+i] && r["a"+i]===questions[r.qIndex].correct) ups[`p${i}Score`] = r[`p${i}Score`]+1; });
        await db.ref('rooms/'+curRoom).update(ups);
        setTimeout(async () => {
            const snap = await db.ref('rooms/'+curRoom).get(); const rs = snap.val();
            if(rs.qIndex+1 < questions.length) { await db.ref('rooms/'+curRoom).update({ qIndex:rs.qIndex+1, a1:-1, a2:-1, a3:-1, a4:-1, timeLeft:30, roundEnded:false }); isL=false; }
            else db.ref('rooms/'+curRoom).update({status:'ended'});
        }, 8500);
    }

    function showF(r) {
        let ps = []; [1,2,3,4].forEach(i => { if(r["p"+i]) ps.push({n:r["p"+i], s:r["p"+i+"Score"], av:r["p"+i+"Av"]}); });
        ps.sort((a,b)=>b.s-a.s);
        const o = document.getElementById('countdownOverlay'); o.style.display='flex';
        document.getElementById('cdText').innerText = "کۆتایی یاری! ئەنجامەکان...";
        let c = 3; document.getElementById('cdNum').innerText = c;
        let int = setInterval(() => {
            c--; if(c>0) document.getElementById('cdNum').innerText=c;
            else {
                clearInterval(int);
                document.getElementById('gameSection').innerHTML = `<h2 style="text-align:center;color:var(--led-gold);margin-top:20px;">براوە: ${ps[0].n}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;">${ps.map(p=>`<div class="score-box active"><img src="${p.av || curAv}" class="player-avatar"><div>${p.n}</div><div>${p.s}</div></div>`).join('')}</div><button class="action-btn" onclick="location.href='index.html'">گەڕانەوە بۆ هۆم</button>`;
            }
        }, 1000);
    }

    const sC = document.getElementById('starsCont');
    for(let i=0;i<60;i++){ const s=document.createElement('div'); s.className='star'; let sz=Math.random()*2+1; s.style.width=sz+'px'; s.style.height=sz+'px'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.setProperty('--duration', (Math.random()*3+2)+'s'); sC.appendChild(s); }
</script>
</body>
</html>
