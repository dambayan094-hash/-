<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>باڵی هاوڕێیان - PUBG Lobby</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --led-blue: #00d2ff; --led-gold: #facc15; --led-purple: #9d50bb; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); 
            color: white; font-family: 'Segoe UI', sans-serif; 
            min-height: 100vh; direction: rtl; overflow-x: hidden; 
        }

        /* Background */
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        .moon { position: fixed; top: 10%; left: 10%; width: 70px; height: 70px; background: #f1f5f9; border-radius: 50%; box-shadow: 0 0 25px #f1f5f9; z-index: -1; pointer-events: none; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Header */
        .header-bar { 
            position: sticky; top: 0; z-index: 1000; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; background: rgba(11, 17, 32, 0.85); 
            backdrop-filter: blur(15px); border-bottom: 2px solid var(--led-blue); 
            box-shadow: 0 0 15px var(--led-blue);
        }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .circle-btn { 
            background: rgba(0, 210, 255, 0.15); border: 1px solid var(--led-blue); 
            color: white; width: 42px; height: 42px; border-radius: 12px; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; font-size: 20px; 
        }
        .user-av-top { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--led-gold); }

        /* Sidebar Friends */
        #sidebar { 
            position: fixed; top: 0; left: 0; width: 285px; height: 100%; 
            background: #0f172a; border-right: 2px solid var(--led-blue); 
            z-index: 2000; transform: translateX(-100%); transition: 0.3s ease; 
            padding: 20px; box-shadow: 10px 0 30px black; 
        }
        #sidebar.open { transform: translateX(0); }
        .sidebar-close { background: #e11d48; color: white; width: 100%; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }

        /* Main Container */
        .main-container { position: relative; z-index: 100; width: 100%; max-width: 900px; margin: 0 auto; padding: 10px 15px; text-align: center; min-height: 85vh; display: flex; flex-direction: column; }

        /* Mode 1: Normal View (Game Cards) */
        #normalView { display: block; margin-top: 20px; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .game-card { background: rgba(30, 41, 59, 0.6); border: 2px solid #334155; border-radius: 25px; padding: 30px; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .game-card:hover { transform: translateY(-8px); border-color: var(--led-blue); }

        /* Mode 2: Team Lobby (PUBG Style) */
        #teamLobbyView { display: none; flex-direction: column; height: 100%; flex: 1; }
        .team-display { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            align-items: flex-end; gap: 10px; flex: 1; 
            margin-top: 50px; max-width: 600px; margin-left: auto; margin-right: auto;
        }
        .player-spot { display: flex; flex-direction: column; align-items: center; }
        .lobby-av { 
            width: 80px; height: 80px; border-radius: 50%; 
            border: 3px solid var(--led-gold); background: rgba(255,255,255,0.05);
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
        }
        .spot-empty { border: 2px dashed #475569 !important; box-shadow: none !important; }
        .player-label { 
            background: var(--led-blue); color: black; font-weight: bold; 
            padding: 3px 10px; border-radius: 50px; font-size: 10px; 
            margin-top: 10px; width: 75px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        /* Lobby Bottom Controls */
        .bottom-controls { margin-top: 30px; padding-bottom: 20px; }
        .game-select-trigger {
            background: rgba(15, 23, 42, 0.9); border: 2px solid var(--led-purple);
            color: white; padding: 12px 30px; border-radius: 12px;
            cursor: pointer; display: flex; align-items: center; gap: 10px;
            margin: 0 auto 20px auto; transition: 0.3s;
        }
        .game-select-trigger:hover { background: var(--led-purple); }

        .start-btn { 
            background: linear-gradient(180deg, #facc15 0%, #eab308 100%); 
            color: black; width: 250px; padding: 16px; border-radius: 12px; 
            border: 2px solid #000; font-size: 28px; font-weight: 900; 
            cursor: pointer; box-shadow: 0 6px 0 #854d0e, 0 0 30px var(--led-gold);
            display: none; transition: 0.1s;
        }
        .start-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #854d0e; }

        /* Modals */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: #0f172a; width: 92%; max-width: 420px; padding: 25px; border-radius: 30px; border: 2px solid var(--led-gold); position: relative; }
        .modal-close-x { position: absolute; top: 15px; left: 15px; color: white; background: none; border: none; font-size: 24px; cursor: pointer; }

        /* Map Grid Inside Modal */
        .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .map-item { background: #1e293b; border: 2px solid #334155; border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.3s; }
        .map-item.selected { border-color: var(--led-gold); background: rgba(250, 204, 21, 0.15); box-shadow: 0 0 15px var(--led-gold); }
        .map-img { width: 60px; height: 60px; object-fit: contain; margin-bottom: 8px; }

        /* Sidebar Elements */
        .search-box { display: flex; gap: 5px; margin: 10px 0; background: #1e293b; padding: 6px; border-radius: 12px; border: 1px solid #334155; }
        .search-box input { background: none; border: none; color: white; flex: 1; outline: none; padding: 5px; }
        .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 15px; margin-bottom: 8px; }
        .friend-av-img { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--led-gold); margin-left: 10px; }
        .btn-gold-sm { background: var(--led-gold); color: black; border: none; padding: 8px 15px; border-radius: 50px; font-weight: bold; cursor: pointer; }
        
        #notification { position: fixed; top: 20px; left: 20px; background: #1e293b; border: 2px solid var(--led-gold); padding: 20px; border-radius: 20px; z-index: 4000; display: none; width: 280px; box-shadow: 0 0 30px rgba(0,0,0,0.8); animation: slideIn 0.5s; }
        @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    </style>
</head>
<body id="mainBody" onclick="startAudio()">

    <div class="stars-container" id="starsCont"></div>
    <div class="moon"></div>

    <!-- Invitation Notif -->
    <div id="notification">
        <div id="notifText">...</div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button id="notifAccept" style="background:#10b981; color:white; border:none; padding:10px; border-radius:10px; flex:1; cursor:pointer; font-weight:bold;">قبوڵکردن</button>
            <button id="notifReject" style="background:#e11d48; color:white; border:none; padding:10px; border-radius:10px; cursor:pointer;">✕</button>
        </div>
    </div>

    <!-- Sidebar Friends -->
    <div id="sidebar">
        <button class="sidebar-close" onclick="closeSidebar()">گەڕانەوە ✕</button>
        <h3 style="color: var(--led-blue); margin-bottom: 10px;">هاوڕێکان 👥</h3>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="ناوی هاوڕێ...">
            <button style="background:var(--led-gold); border:none; padding:5px 12px; border-radius:8px;" onclick="searchUser()">🔍</button>
        </div>
        <div id="searchResult"></div>
        <div id="requestsArea" style="display:none; margin-top: 15px;">
            <span style="color:var(--led-gold); font-size:11px;">Inbox:</span>
            <div id="requestsList"></div>
        </div>
        <div style="margin-top:20px;">
            <span style="color:var(--led-blue); font-size:11px;">هاوڕێکانت:</span>
            <div id="friendsList"></div>
        </div>
    </div>

    <!-- Header -->
    <div class="header-bar">
        <div class="header-left">
            <button class="circle-btn" onclick="openM('settingsModal')">⚙️</button>
            <button class="circle-btn" onclick="openSidebar()">👥</button>
        </div>
        <div class="header-logo">باڵی هاوڕێیان</div>
        <div class="header-right" onclick="openM('profileModal')">
            <span id="topName" style="font-weight:bold; color:var(--led-gold); font-size:13px;">...</span>
            <img id="topAvatar" src="" class="user-av-top">
        </div>
    </div>

    <div class="main-container">
        <!-- MODE 1: NORMAL VIEW -->
        <div id="normalView">
            <div class="welcome-card led-blue">
                <h1>بەخێربێن بۆ باڵی هاوڕێیان</h1>
                <p style="color:#94a3b8; margin-top:10px;">یارییەک هەڵبژێرە یان هاوڕێیەکت بانگ بکە</p>
            </div>
            <div class="games-grid">
                <a href="game1-online.html" class="game-card" style="border-color:var(--led-blue);">
                    <img src="https://cdn-icons-png.flaticon.com/512/1023/1023656.png" style="width:70px; margin-bottom:10px;">
                    <h2>یاری یەکەم</h2>
                </a>
                <a href="game2.html" class="game-card" style="border-color:var(--led-purple);">
                    <img src="https://cdn-icons-png.flaticon.com/512/1162/1162251.png" style="width:70px; margin-bottom:10px;">
                    <h2>یاری دووەم</h2>
                </a>
            </div>
        </div>

        <!-- MODE 2: TEAM LOBBY VIEW (PUBG STYLE) -->
        <div id="teamLobbyView">
            <div class="team-display">
                <div class="player-spot"><img id="lobbyAv1" src="" class="lobby-av"><div class="player-label" id="lobbyN1">تۆ</div></div>
                <div class="player-spot"><img id="lobbyAv2" src="" class="lobby-av spot-empty"><div class="player-label" id="lobbyN2">خاڵی</div></div>
                <div class="player-spot"><img id="lobbyAv3" src="" class="lobby-av spot-empty"><div class="player-label" id="lobbyN3">خاڵی</div></div>
                <div class="player-spot"><img id="lobbyAv4" src="" class="lobby-av spot-empty"><div class="player-label" id="lobbyN4">خاڵی</div></div>
            </div>

            <div class="bottom-controls">
                <button class="game-select-trigger" onclick="openM('gameModal')">
                    <span id="selectedGameName">یارییەک هەڵبژێرە</span> 🗺️
                </button>
                <button id="startTeamGame" class="start-btn" onclick="startGameNow()">START</button>
                <button style="background:none; color:#f87171; border:none; text-decoration:underline; font-size:12px; cursor:pointer; margin-top:10px;" onclick="leaveTeam()">تێکشاندنی تیم</button>
            </div>
        </div>
    </div>

    <!-- Map Modal -->
    <div id="gameModal" class="modal">
        <div class="modal-content" style="border-color: var(--led-purple);">
            <button class="modal-close-x" onclick="closeM('gameModal')">✕</button>
            <h2 style="text-align:center; color:var(--led-purple); margin-bottom:20px;">Maps</h2>
            <div class="map-grid">
                <div class="map-item" id="map1" onclick="selectGame(1, 'خولانەوەی بەخت')">
                    <img src="https://cdn-icons-png.flaticon.com/512/1023/1023656.png" class="map-img">
                    <div style="font-weight:bold; font-size:12px;">یاری یەکەم</div>
                </div>
                <div class="map-item" id="map2" onclick="selectGame(2, 'پێشبڕکێی زیرەکی')">
                    <img src="https://cdn-icons-png.flaticon.com/512/1162/1162251.png" class="map-img">
                    <div style="font-weight:bold; font-size:12px;">یاری دووەم</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile & Settings Modals -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <button class="modal-close-x" onclick="closeM('profileModal')">✕</button>
            <h2 style="text-align: center; color: var(--led-gold);">پڕۆفایل</h2>
            <div style="text-align: center; margin: 20px 0;"><img id="midAvatar" src="" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--led-gold);"><h3 id="midName"></h3></div>
            <div id="avGrid" class="avatar-grid"></div>
            <button style="background:#e11d48; color:white; border:none; padding:12px; border-radius:50px; width:100%; margin-top:20px; font-weight:bold;" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content" style="border-color: var(--led-blue);">
            <button class="modal-close-x" onclick="closeM('settingsModal')">✕</button>
            <h2 style="text-align: center; color: var(--led-blue); margin-bottom: 30px;">Settings</h2>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;"><span>میوزیک</span><button id="msBtn" onclick="tglMus()" style="background:#334155; border:none; color:white; padding:8px 15px; border-radius:10px;">پێکراوە</button></div>
            <div style="display:flex; justify-content:space-between; align-items:center;"><span>دەنگی یاری</span><input type="range" id="vSlide" min="0" max="1" step="0.1" onchange="svSet()"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAVUxyWwAuY_ZnwjFC9WZp1NVp1l815a4c", authDomain: "yari-online.firebaseapp.com", databaseURL: "https://yari-online-default-rtdb.firebaseio.com", projectId: "yari-online", storageBucket: "yari-online.firebasestorage.app", messagingSenderId: "503368361126", appId: "1:503368361126:web:09028d371b17372e320067" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let curU = localStorage.getItem('currentUser'), curA = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky";
        const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3');
        bgMusic.loop = true; let aStarted = false;
        let currentTeamID = null;

        if(!curU) window.location.href = 'login.html';

        function openSidebar() { document.getElementById('sidebar').classList.add('open'); }
        function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
        function openM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }
        function logout() { localStorage.removeItem('currentUser'); window.location.href='login.html'; }
        function startAudio() { if(!aStarted) { if(localStorage.getItem('music') !== 'off') bgMusic.play().catch(()=>{}); bgMusic.volume = localStorage.getItem('volume') || 0.5; aStarted = true; } }
        function tglMus() { let m = localStorage.getItem('music') === 'off' ? 'on' : 'off'; localStorage.setItem('music', m); document.getElementById('msBtn').innerText = m === 'on' ? 'پێکراوە' : 'کوژاوەتەوە'; if(m === 'on') bgMusic.play(); else bgMusic.pause(); }
        function svSet() { localStorage.setItem('volume', document.getElementById('vSlide').value); bgMusic.volume = document.getElementById('vSlide').value; }

        async function searchUser() {
            const n = document.getElementById('searchInput').value.trim();
            if(!n || n===curU) return;
            db.ref('users').orderByChild('name').equalTo(n).once('value', s => {
                const res = document.getElementById('searchResult');
                if(s.exists()){
                    const u = Object.values(s.val())[0];
                    res.innerHTML = `<div class="friend-item"><div><img src="${u.avatar}" class="friend-av-img">${u.name}</div><button class="btn-gold-sm" onclick="sendReq('${u.name}')">Add</button></div>`;
                } else res.innerHTML = "<small>نەدۆزرایەوە!</small>";
            });
        }
        async function sendReq(t) { await db.ref(`requests/${t}/${curU}`).set({from:curU, avatar:curA}); alert("داواکاری نێردرا!"); }
        async function acceptReq(id, av) { await db.ref(`friends/${curU}/${id}`).set({ avatar: av }); await db.ref(`friends/${id}/${curU}`).set({ avatar: curA }); await db.ref(`requests/${curU}/${id}`).remove(); }
        
        async function inviteToTeam(tid) { 
            const teamID = currentTeamID || "team_"+curU;
            currentTeamID = teamID;
            const teamSnap = await db.ref('teams/'+teamID).get();
            if(!teamSnap.exists()) await db.ref('teams/'+teamID).set({ p1:curU, p1Av:curA, p2:"", p3:"", p4:"", status:'lobby', selectedGame: 0 });
            await db.ref('teamInvites/'+tid).set({ from:curU, teamID: teamID });
            alert("بانگێشت نێردرا!");
        }

        async function acceptTeam(d) {
            const teamSnap = await db.ref('teams/'+d.teamID).get();
            if(teamSnap.exists()) {
                const team = teamSnap.val();
                let slot = team.p2===""?"p2":(team.p3===""?"p3":(team.p4===""?"p4":""));
                if(slot) { await db.ref(`teams/${d.teamID}/${slot}`).set(curU); await db.ref(`teams/${d.teamID}/${slot}Av`).set(curA); }
            }
            await db.ref('teamInvites/'+curU).remove();
            document.getElementById('notification').style.display='none';
        }

        async function selectGame(id, name) {
            if(currentTeamID) {
                await db.ref('teams/'+currentTeamID).update({ selectedGame: id, gameName: name });
                document.getElementById('map1').classList.toggle('selected', id === 1);
                document.getElementById('map2').classList.toggle('selected', id === 2);
                closeM('gameModal');
            }
        }

        async function startGameNow() {
            if(currentTeamID) {
                const rID = Math.random().toString(36).substring(2, 7).toUpperCase();
                await db.ref('teams/'+currentTeamID).update({ status: 'gaming', roomID: rID });
                setTimeout(() => db.ref('teams/'+currentTeamID).remove(), 2000);
            }
        }

        async function leaveTeam() { if(currentTeamID) await db.ref('teams/'+currentTeamID).remove(); location.reload(); }
        function closeNotif() { db.ref('teamInvites/'+curU).remove(); document.getElementById('notification').style.display='none'; }

        function init() {
            document.getElementById('topName').innerText = curU; document.getElementById('midName').innerText = curU;
            document.getElementById('topAvatar').src = curA; document.getElementById('midAvatar').src = curA;
            document.getElementById('lobbyAv1').src = curA; 
            db.ref('users/'+curU).set({name:curU, avatar:curA, status:'online'}); 
            db.ref('users/'+curU).onDisconnect().remove();

            db.ref('requests/'+curU).on('value', s => {
                const d = s.val(); const list = document.getElementById('requestsList'); list.innerHTML = "";
                if(d) { document.getElementById('requestsArea').style.display='block'; for(let id in d) list.innerHTML += `<div class="friend-item"><span>${id}</span><button class="btn-gold-sm" style="background:#10b981; color:white;" onclick="acceptReq('${id}','${d[id].avatar}')">✅</button></div>`; }
                else document.getElementById('requestsArea').style.display='none';
            });

            db.ref('friends/'+curU).on('value', s => {
                const d = s.val(); const list = document.getElementById('friendsList'); list.innerHTML = "";
                if(d) for(let id in d) list.innerHTML += `<div class="friend-item"><div><img src="${d[id].avatar}" class="friend-av-img">${id}</div><button class="btn-gold-sm" style="background:var(--led-blue);" onclick="inviteToTeam('${id}')">Invite</button></div>`;
            });

            db.ref('teamInvites/'+curU).on('value', s => {
                const d = s.val(); if(d) { document.getElementById('notification').style.display='block'; document.getElementById('notifText').innerHTML = `🎮 <b>${d.from}</b> دەیەوێت ببیتە تیم!`; document.getElementById('notifAccept').onclick = () => acceptTeam(d); document.getElementById('notifReject').onclick = () => closeNotif(); }
            });

            db.ref('teams').on('value', s => {
                const teams = s.val(); let inT = false;
                for (let id in teams) {
                    const t = teams[id];
                    if (t.p1 === curU || t.p2 === curU || t.p3 === curU || t.p4 === curU) {
                        inT = true; currentTeamID = id;
                        document.getElementById('normalView').style.display = 'none';
                        document.getElementById('teamLobbyView').style.display = 'flex';
                        for(let i=1; i<=4; i++) {
                            const av = t["p"+i+"Av"]; const name = t["p"+i];
                            document.getElementById('lobbyAv'+i).src = av || "https://api.dicebear.com/7.x/avataaars/svg?seed=empty";
                            document.getElementById('lobbyAv'+i).classList.toggle('spot-empty', !name);
                            document.getElementById('lobbyN'+i).innerText = name || "خاڵی";
                        }
                        if(t.selectedGame > 0) document.getElementById('selectedGameName').innerText = "Map: " + t.gameName;
                        if (t.p1 === curU && t.selectedGame > 0) document.getElementById('startTeamGame').style.display = 'block';
                        else document.getElementById('startTeamGame').style.display = 'none';
                        if (t.status === 'gaming') window.location.href = `${t.selectedGame===1?'game1-online.html':'game2.html'}?join=${t.roomID}&teamID=${id}`;
                    }
                }
                if (!inT) { document.getElementById('normalView').style.display = 'block'; document.getElementById('teamLobbyView').style.display = 'none'; }
            });

            const g = document.getElementById('avGrid'); g.innerHTML = "";
            for(let i=1; i<=8; i++) {
                let u = `https://api.dicebear.com/7.x/avataaars/svg?seed=Avatar${i + 500}`;
                let im = document.createElement('img'); im.src = u; im.className = 'avatar-opt' + (u === curA ? ' selected' : '');
                im.onclick = () => { localStorage.setItem('userAvatar', u); location.reload(); };
                g.appendChild(im);
            }
        }

        const sCont = document.getElementById('starsCont');
        for(let i=0; i<100; i++) {
            const s = document.createElement('div'); s.className = 'star';
            let sz = Math.random() * 3 + 1; s.style.width = sz + 'px'; s.style.height = sz + 'px';
            s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%';
            s.style.setProperty('--duration', (Math.random() * 3 + 1.5) + 's');
            sCont.appendChild(s);
        }
        init();
    </script>
