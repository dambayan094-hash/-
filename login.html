<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>داخلبوون - ماڵی هاوڕیان</title>
<!-- Favicon - ئایکۆنی براوزەر -->
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAmElEQVR4AWMY/qMXiP8D8X8gHgXEj4D4MRBPBmLh/zwIYGDkIMWbUECMh+4FBKRwkxKYY0lxiCQgwH0BYBwfA+IDQLwNiC8wMkDcMAGI/wPxHCDeAMRPgZgRmQMIgjchGgAqJYTGowGOAfGDVQFlIF6KGgAqJQbGQwH8BmI2oGJhIF4BxGyoa0DmWEDFf/4zMJCm8x9qLgDVbUj2XJ1IvgAAAABJRU5ErkJggg==">
<link rel="stylesheet" href="style-common.css">
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="container">
    <div class="logo">🏠✨</div>
    <h1>ماڵی هاوڕیان</h1>
    <div class="sub">بچۆرە ژوورەوە بۆ دەستپێکردنی یاری</div>
    
    <div class="form-group">
        <label>👤 ناوی بەکارهێنەر</label>
        <input type="text" id="username" placeholder="ناوی بەکارهێنەر">
    </div>
    <div class="form-group">
        <label>🔒 تێپەڕەوشە</label>
        <input type="password" id="password" placeholder="تێپەڕەوشە">
    </div>
    <button class="login-btn" id="loginBtn">🔐 داخلبوون</button>
    <div id="message" class="message"></div>
    <div class="footer">✨ پێشبڕکێی هاوڕیانی خۆش ✨</div>
</div>

<script>
const users = {"مەڕوا":"1234","محمد":"1234","ئەشڕەف":"1234","ژوان":"1234"};
function login(username, password){
    if(users[username] && users[username] === password){
        localStorage.setItem('currentUser', username);
        return true;
    }
    return false;
}
const loginBtn = document.getElementById('loginBtn');
const usernameInput = document.getElementById('username');
const passwordInput = document.getElementById('password');
const messageDiv = document.getElementById('message');

loginBtn.addEventListener('click',()=>{
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    if(!username || !password){
        messageDiv.innerHTML = '<span class="error">❌ تکایە ناو و تێپەڕەوشەکەت بنووسە!</span>';
        return;
    }
    if(login(username, password)){
        messageDiv.innerHTML = '<span class="success">✅ داخلبوون سەرکەوتوو بوو! ئاراستەکردن...</span>';
        setTimeout(()=>{ window.location.href = 'index.html'; }, 1000);
    } else {
        messageDiv.innerHTML = '<span class="error">❌ ناوی بەکارهێنەر یان تێپەڕەوشە هەڵەیە!</span>';
    }
});
window.addEventListener('load',()=>{
    let savedUser = localStorage.getItem('currentUser');
    if(savedUser && users[savedUser]) window.location.href = 'index.html';
});
function genStars(){
    const starCont = document.getElementById('stars');
    for(let i=0;i<160;i++){
        const s=document.createElement('div');s.classList.add('star');
        let sz=Math.random()*3+1;s.style.width=sz+'px';s.style.height=sz+'px';
        s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
        s.style.animationDelay=Math.random()*5+'s';
        s.style.animationDuration=(Math.random()*3+1.5)+'s';
        if(sz>2) s.style.boxShadow='0 0 4px white';
        starCont.appendChild(s);
    }
}
genStars();
</script>
</body>
</html>
