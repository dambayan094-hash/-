<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>یاری دووەم - باڵی هاوڕێیان</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { --led-blue: #00d2ff; --led-gold: #facc15; --led-purple: #9d50bb; }
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body { margin: 0; padding: 15px; background: #050a18; color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; overflow: hidden; direction: rtl; display: flex; justify-content: center; align-items: center; }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        .game-card { background-color: rgba(11, 17, 32, 0.96); border: 2px solid var(--led-blue); border-radius: 30px; padding: 25px; box-shadow: 0 0 30px var(--led-blue); position: relative; z-index: 10; width: 100%; max-width: 550px; min-height: 250px; }
        .back-home-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--led-blue); color: white; padding: 8px 20px; border-radius: 50px; cursor: pointer; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 20px; outline: none; }
        .score-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        @media (min-width: 480px) { .score-container { grid-template-columns: repeat(4, 1fr); } }
        .score-box { border: 2px solid #334155; border-radius: 18px; padding: 10px; text-align: center; background: rgba(255,255,255,0.02); transition: 0.3s; }
        .score-box.active { border-color: var(--led-gold); box-shadow: 0 0 15px var(--led-gold); transform: scale(1.05); }
        .player-avatar { width: 45px; height: 45px; border-radius: 50%; margin-bottom: 5px; border: 1px solid rgba(255,255,255,0.1); background: #1e293b; }
        .question-area { border: 2px solid var(--led-gold); border-radius: 25px; padding: 20px; margin-bottom: 20px; position: relative; background: rgba(0,0,0,0.3); }
        .timer-box { text-align:center; font-size:26px; font-weight:bold; color:var(--led-gold); margin-bottom:10px; }
        .option-btn { width: 100%; background: transparent; border: 1px solid #334155; color: #94a3b8; padding: 15px; border-radius: 50px; cursor: pointer; margin: 6px 0; font-family: inherit; font-size: 15px; transition: 0.2s; }
        .option-btn.selected { background: var(--led-blue); color: white; border-color: white; box-shadow: 0 0 10px var(--led-blue); }
        .option-btn.correct { background: #166534 !important; border-color: #4ade80 !important; color: white; }
        .option-btn.wrong { background: #991b1b !important; border-color: #f87171 !important; color: white; }
        .action-btn { width: 100%; padding: 16px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; background: var(--led-blue); color: #000; font-size: 16px; margin-top: 10px; }
        #countdownOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11,17,32,0.98); border-radius: 25px; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; padding: 20px; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body onclick="initAudio()">
    <div class="stars-container" id="starsCont"></div>
    <div class="game-card">
        <div id="statusLoader">تکایە بوەستە...</div>
        <div id="roomSection" style="display:none;">
            <a href="index.html" class="back-home-btn">🏠 هۆم</a>
            <h2 style="text-align:center; color: var(--led-blue); margin-bottom: 20px;">🎮 کێبڕکێی زیرەکی</h2>
            <button class="action-btn" onclick="createR()">دروستکردنی ژوور</button>
            <div style="margin: 20px 0; text-align: center; color: #475569;">— یان —</div>
            <input type="text" id="joinIn" placeholder="کۆدی ژوور" style="width:100%; padding:16px; border-radius:50px; text-align:center; background:#050a18; color:white; border:1px solid #334155; margin-bottom: 15px; outline: none;">
            <button class="action-btn" style="background:#10b981; color: white;" onclick="joinR()">چوونە ناو ژوور ✅</button>
        </div>
        <div id="waitingSection" style="display:none; text-align: center;">
            <a href="index.html" class="back-home-btn">🏠 گەڕانەوە</a>
            <div id="codeDisp" style="color:white; font-size:40px; font-weight:bold; letter-spacing:8px; margin: 20px 0;"></div>
            <div id="playerList" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:20px 0;"></div>
            <button id="startBtn" class="action-btn" style="display:none; background:#8b5cf6; color:white;" onclick="startG()">START 🚀</button>
        </div>
        <div id="gameSection" style="display:none;">
            <div class="score-container" id="scoreBoard"></div>
            <div class="question-area">
                <div id="countdownOverlay"><div id="cdText" style="color:var(--led-gold); font-weight:bold;"></div><div id="cdNum" style="font-size:24px; color:white;"></div></div>
                <div class="timer-box">⏱️ <span id="timerDisp">30</span></div>
                <h3 id="qText" style="text-align:center; min-height:50px; font-size:18px;"></h3>
                <div id="optionsCont" style="margin-top:10px;"></div>
            </div>
            <button class="action-btn" style="background:#e11d48; color:white;" onclick="leaveGame()">📕 دەرچوون</button>
        </div>
    </div>

<script>
    const tickS = new Audio('https://actions.google.com/sounds/v1/ui/click_on.ogg');
    const winS = new Audio('https://actions.google.com/sounds/v1/cartoon/clown_horn_accent.ogg');
    let aInit = false;
    function initAudio() { if(!aInit) { tickS.play(); tickS.pause(); winS.play(); winS.pause(); aInit = true; } }
    function playS(s) { if(localStorage.getItem('music')!=='off') { s.currentTime=0; s.play().catch(()=>{}); } }

    const firebaseConfig = { apiKey: "AIzaSyAVUxyWwAuY_ZnwjFC9WZp1NVp1l815a4c", authDomain: "yari-online.firebaseapp.com", databaseURL: "https://yari-online-default-rtdb.firebaseio.com", projectId: "yari-online", storageBucket: "yari-online.firebasestorage.app", messagingSenderId: "503368361126", appId: "1:503368361126:web:09028d371b17372e320067" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // ٥٠٠ پرسیارەکان لێرە بن
    const questions = [
        {text:"پایتەختی فەڕەنسا کام شارەیە؟",options:["لەندەن","پاریس","ڕۆما","بەرلین"],correct:1},
        {text:"گەورەترین وڵاتی جیهان کامەیە؟",options:["چین","ئەمریکا","ڕووسیا","کەنەدا"],correct:2},
        {text:"ئاڵای کوردستان لە چەند ڕەنگ پێکهاتووە؟",options:["٢","٣","٤","٥"],correct:2},
        {text:"درێژترین ڕووباری جیهان کامەیە؟",options:["نیل","ئەمازۆن","دیجلە","فوڕات"],correct:0},
        {text:"کێ وێنەی 'مۆنالیزا'ی کێشا؟",options:["پیکاسۆ","داڤینشی","ڤان گۆخ","مایکل ئەنجیلۆ"],correct:1}
        // ... لێرە هەموو ٥٠٠ پرسیارەکە دابنێ
    ];

    let curU = localStorage.getItem('currentUser'), curAv = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky", curRoom = null, pNum = null, isL = false, lastQ = -1, lastRE = false, isChoiceLocked = false;

    window.addEventListener('load', async () => {
        const params = new URLSearchParams(window.location.search);
        const joinId = params.get('join');
        const teamID = params.get('teamID');
        if (joinId) {
            if(teamID) db.ref('teams/'+teamID).remove();
            setTimeout(async () => { await handleAutoJoin(joinId); }, 1000);
        } else {
            showView('roomSection');
        }
    });

    async function handleAutoJoin(id) {
        const snap = await db.ref('rooms/'+id).get();
        curRoom = id;
        if (!snap.exists()) {
            await db.ref('rooms/'+id).set({ p1:curU, p1Score:0, a1:-1, p1Av:curAv, p2:"", p2Score:0, a2:-1, p2Av:"", p3:"", p4:"", status:'waiting', qIndex:0, timeLeft:30, roundEnded:false, qList:[] });
            pNum = 1;
        } else {
            let r = snap.val();
            if(r.p1 === curU) pNum = 1;
            else if(r.p2 === curU) pNum = 2;
            else if(r.p3 === curU) pNum = 3;
            else if(r.p4 === curU) pNum = 4;
            else {
                let slot = r.p2===""?"p2":(r.p3===""?"p3":(r.p4===""?"p4":""));
                if(slot) { pNum = parseInt(slot[1]); await db.ref('rooms/'+id+'/'+slot).set(curU); await db.ref('rooms/'+id+'/'+slot+'Av').set(curAv); }
                else { alert("پڕە"); return location.href='index.html'; }
            }
        }
        document.getElementById('statusLoader').style.display = 'none';
        listenR(id);
    }

    function showView(viewId) {
        document.getElementById('statusLoader').style.display = 'none';
        document.getElementById('roomSection').style.display = 'none';
        document.getElementById('waitingSection').style.display = 'none';
        document.getElementById('gameSection').style.display = 'none';
        document.getElementById(viewId).style.display = 'block';
    }

    async function createR() { const id = Math.random().toString(36).substring(2, 7).toUpperCase(); curRoom = id; pNum = 1; await db.ref('rooms/'+id).set({ p1:curU, p1Score:0, a1:-1, p1Av:curAv, p2:"", p2Score:0, a2:-1, p2Av:"", p3:"", p4:"", status:'waiting', qIndex:0, timeLeft:30, roundEnded:false, qList:[] }); listenR(id); showView('waitingSection'); }
    async function joinR() { const id = document.getElementById('joinIn').value.toUpperCase(); if(id) handleAutoJoin(id); }

    function listenR(id) {
        db.ref('rooms/'+id).on('value', snap => {
            const r = snap.val(); if(!r) return;
            document.getElementById('codeDisp').innerText = id;
            const pL = document.getElementById('playerList'); pL.innerHTML = "";
            [1,2,3,4].forEach(i => { if(r["p"+i]) pL.innerHTML += `<div class="score-box active"><img src="${r['p'+i+'Av'] || curAv}" class="player-avatar"><br><span style="font-size:10px;">${r["p"+i]}</span></div>`; });
            if(pNum===1 && r.p2 && r.status === 'waiting') document.getElementById('startBtn').style.display = 'block';
            if(r.status==='playing') { showView('gameSection'); startA(); }
            if(r.status==='ended') showF(r);
        });
    }

    function startG() { 
        // دروستکردنی لیستێکی هەڕەمەکی لە ١٠ پرسیار
        let randomQs = [];
        while(randomQs.length < 10) {
            let r = Math.floor(Math.random() * questions.length);
            if(!randomQs.includes(r)) randomQs.push(r);
        }
        db.ref('rooms/'+curRoom).update({status:'playing', a1:-1, a2:-1, a3:-1, a4:-1, qIndex: 0, qList: randomQs}); 
    }

    function startA() {
        db.ref('rooms/'+curRoom).on('value', snap => {
            const r = snap.val(); if(!r || r.status!=='playing') return;
            if(r.roundEnded && !lastRE) { playS(winS); showO(r); }
            lastRE = r.roundEnded;
            updateUI(r);
            if(pNum===1 && !r.roundEnded && !isL) {
                let allAns = true;
                [1,2,3,4].forEach(i => { if(r["p"+i] !== "" && r["a"+i] === -1) allAns = false; });
                if(allAns && r.timeLeft > 5) db.ref('rooms/'+curRoom).update({timeLeft:5});
                if(r.timeLeft <= 0) { isL=true; handleRE(r); }
            }
        });
        if(pNum===1) { if(window.timerSet) clearInterval(window.timerSet); window.timerSet = setInterval(async () => { const s = await db.ref('rooms/'+curRoom).get(); const r = s.val(); if(r && r.status==='playing' && !r.roundEnded && r.timeLeft > 0) db.ref('rooms/'+curRoom).update({timeLeft:r.timeLeft-1}); }, 1000); }
    }

    function updateUI(r) {
        const tD = document.getElementById('timerDisp');
        if(tD.innerText != r.timeLeft && r.timeLeft>0 && !r.roundEnded) playS(tickS);
        tD.innerText = r.timeLeft;
        const sB = document.getElementById('scoreBoard'); sB.innerHTML = "";
        [1,2,3,4].forEach(i => { if(r["p"+i] && r["p"+i]!=="") sB.innerHTML += `<div class="score-box ${(r['a'+i]!==-1 && !r.roundEnded)?'active':''}"><img src="${r['p'+i+'Av'] || curAv}" class="player-avatar"><div>${r["p"+i]}</div><div style="font-weight:bold;">${r["p"+i+"Score"] || 0}</div></div>`; });
        
        // وەرگرتنی پرسیار لە ناو لیستە هەڕەمەکییەکە
        if(!r.qList) return;
        const qIndexInArray = r.qList[r.qIndex];
        const q = questions[qIndexInArray];

        if(lastQ !== r.qIndex) { isChoiceLocked = false; lastQ = r.qIndex; }
        if(lastQ === r.qIndex || r.roundEnded) {
            document.getElementById('qText').innerText = q.text;
            const c = document.getElementById('optionsCont'); c.innerHTML = "";
            q.options.forEach((opt, i) => {
                const b = document.createElement('button'); b.className = 'option-btn'; b.innerText = `${['A','B','C','D'][i]} - ${opt}`;
                if(r["a"+pNum]===i) b.classList.add('selected');
                b.disabled = (r["a"+pNum]!==-1) || r.roundEnded || isChoiceLocked;
                if(r.roundEnded) { if(i===q.correct) b.classList.add('correct'); else if(i===r["a"+pNum]) b.classList.add('wrong'); }
                b.onclick = () => { if(isChoiceLocked) return; isChoiceLocked = true; playS(tickS); db.ref('rooms/'+curRoom+'/a'+pNum).set(i); };
                c.appendChild(b);
            });
            if(!r.roundEnded) document.getElementById('countdownOverlay').style.display='none';
        }
    }

    function showO(r) {
        const o = document.getElementById('countdownOverlay'); const ct = document.getElementById('cdText'); const cn = document.getElementById('cdNum');
        const qIndexInArray = r.qList[r.qIndex];
        o.style.display = 'flex'; ct.innerText = "وەڵامی ڕاست:"; cn.innerText = questions[qIndexInArray].options[questions[qIndexInArray].correct];
        setTimeout(() => { ct.innerText = "ئامادەبە!"; let c = 5; cn.innerText = c; let int = setInterval(() => { c--; if(c>0) { cn.innerText=c; playS(tickS); } else clearInterval(int); }, 1000); }, 2500);
    }

    async function handleRE(r) {
        let updates = { roundEnded: true };
        const qIndexInArray = r.qList[r.qIndex];
        const q = questions[qIndexInArray];
        [1,2,3,4].forEach(i => { if(r["p"+i] && r["p"+i]!=="" && r["a"+i] === q.correct) updates[`p${i}Score`] = (r[`p${i}Score`] || 0) + 1; });
        await db.ref('rooms/'+curRoom).update(updates);
        setTimeout(async () => {
            const snap = await db.ref('rooms/'+curRoom).get(); const rs = snap.val();
            // لێرە پشکنین دەکەین ئایا گەیشتینە ١٠ پرسیار
            if(rs.qIndex + 1 < 10) { await db.ref('rooms/'+curRoom).update({ qIndex:rs.qIndex+1, a1:-1, a2:-1, a3:-1, a4:-1, timeLeft:30, roundEnded:false }); isL=false; }
            else db.ref('rooms/'+curRoom).update({status:'ended'});
        }, 8500);
    }

    function showF(r) {
        if(window.timerSet) clearInterval(window.timerSet);
        let ps = []; [1,2,3,4].forEach(i => { if(r["p"+i] && r["p"+i]!=="") ps.push({n:r["p"+i], s:r["p"+i+"Score"] || 0, av:r["p"+i+"Av"]}); });
        ps.sort((a,b)=>b.s-a.s);
        document.getElementById('gameSection').innerHTML = `<h2 style="text-align:center;color:var(--led-gold);margin-top:20px;">👑 براوە: ${ps[0].n}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0;">${ps.map(p=>`<div class="score-box active"><img src="${p.av || curAv}" class="player-avatar"><div>${p.n}</div><div style="font-weight:bold;">${p.s}</div></div>`).join('')}</div><button class="action-btn" onclick="location.href='index.html'">گەڕانەوە بۆ هۆم</button>`;
    }

    async function leaveGame() {
        if (curRoom && pNum) {
            let updates = {}; updates[`p${pNum}`] = ""; updates[`p${pNum}Av`] = ""; updates[`a${pNum}`] = -1; updates[`p${pNum}Score`] = 0;
            await db.ref('rooms/' + curRoom).update(updates);
        }
        location.href = 'index.html';
    }

    const sC = document.getElementById('starsCont');
    for(let i=0;i<60;i++){ const s=document.createElement('div'); s.className='star'; let sz=Math.random()*2+1; s.style.width=sz+'px'; s.style.height=sz+'px'; s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%'; s.style.setProperty('--duration', (Math.random()*3+2)+'s'); sC.appendChild(s); }
</script>
</body>
</html>
