<!DOCTYPE html>
<html lang="ku">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>باڵی هاوڕێیان - Pro Search</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
    :root { --led-blue: #00d2ff; --led-gold: #facc15; --led-purple: #9d50bb; }
    body { margin: 0; padding: 0; background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%); color: white; font-family: 'Segoe UI', sans-serif; min-height: 100vh; direction: rtl; overflow-x: hidden; }
    
    .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
    .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite; }
    .moon { position: fixed; top: 10%; left: 10%; width: 70px; height: 70px; background: #f1f5f9; border-radius: 50%; box-shadow: 0 0 20px #f1f5f9; z-index: 1; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

    .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(11, 17, 32, 0.8); backdrop-filter: blur(15px); border-bottom: 2px solid var(--led-blue); position: sticky; top: 0; z-index: 500; box-shadow: 0 0 15px var(--led-blue); }
    .header-left-group { display: flex; align-items: center; gap: 15px; }
    .friends-toggle-btn { background: rgba(0, 210, 255, 0.2); border: 1px solid var(--led-blue); color: white; width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
    .settings-btn { font-size: 24px; cursor: pointer; }
    .profile-trigger { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .user-avatar-top { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--led-gold); background: #1e293b; }

    #sidebar { position: fixed; top: 0; left: 0; width: 280px; height: 100%; background: rgba(11, 17, 32, 0.98); backdrop-filter: blur(20px); border-right: 2px solid var(--led-blue); z-index: 1000; transform: translateX(-100%); transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 20px; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
    #sidebar.open { transform: translateX(0); }
    .close-sidebar-btn { background: rgba(225, 29, 72, 0.2); border: 1px solid #e11d48; color: white; width: 100%; padding: 10px; border-radius: 12px; cursor: pointer; margin-bottom: 20px; font-weight: bold; font-family: inherit; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
    .modal-content { background: #0f172a; width: 90%; max-width: 400px; padding: 25px; border-radius: 30px; border: 2px solid var(--led-gold); position: relative; }

    .search-box { display: flex; gap: 5px; margin: 10px 0; background: rgba(255,255,255,0.05); padding: 5px; border-radius: 10px; border: 1px solid #334155; }
    .search-box input { background: none; border: none; color: white; flex: 1; outline: none; font-size: 13px; font-family: inherit; }
    .search-btn { background: var(--led-gold); border: none; border-radius: 8px; padding: 4px 10px; cursor: pointer; font-weight: bold; }
    
    .friend-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 8px; }
    .friend-av { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--led-gold); margin-left: 8px; }
    .invite-btn { background: var(--led-blue); color: black; border: none; padding: 4px 12px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 11px; }

    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 10; text-align: center; }
    .welcome-card { background: rgba(15, 23, 42, 0.8); border: 3px solid var(--led-blue); border-radius: 25px; padding: 25px; margin-bottom: 35px; box-shadow: 0 0 20px var(--led-blue); }
    .game-card { background: rgba(30, 41, 59, 0.5); border: 2px solid var(--led-purple); border-radius: 25px; padding: 25px; text-decoration: none; color: white; display: flex; flex-direction: column; align-items: center; transition: 0.3s; box-shadow: 0 0 15px var(--led-purple); }

    #notification { position: fixed; top: 20px; left: 20px; background: #1e293b; border: 2px solid var(--led-gold); padding: 20px; border-radius: 20px; z-index: 3000; display: none; width: 280px; box-shadow: 0 0 30px rgba(0,0,0,0.8); animation: slideIn 0.5s; }
    @keyframes slideIn { from { transform: translateX(-100%); } to { transform: translateX(0); } }

    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
    .avatar-opt { width: 100%; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
    .avatar-opt.selected { border-color: var(--led-gold); transform: scale(1.1); }
</style>
</head>
<body onclick="initHomeAudio()">

<div class="stars" id="starsCont"></div>
<div class="moon"></div>

<!-- Sidebar (Friends List) -->
<div id="sidebar">
    <button class="close-sidebar-btn" onclick="toggleSidebar()">گەڕانەوە ✕</button>
    <h3 style="color: var(--led-blue); margin-bottom: 10px;">هاوڕێکان 👥</h3>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ناوی هاوڕێ بنووسە...">
        <button class="search-btn" onclick="searchUser()">🔍</button>
    </div>
    <div id="searchResult"></div>

    <div id="requestsArea" style="display: none; margin-top: 15px;">
        <span style="font-size: 11px; color: var(--led-gold);">Inbox (داواکارییەکان):</span>
        <div id="requestsList"></div>
    </div>

    <div style="margin-top: 20px;">
        <span style="font-size: 11px; color: var(--led-blue);">هاوڕێکانت:</span>
        <div id="friendsList" style="margin-top: 10px;"></div>
    </div>
</div>

<!-- Notification -->
<div id="notification">
    <div id="notifText">...</div>
    <div style="display:flex; gap:10px; margin-top:15px;">
        <button id="notifAccept" style="background:#10b981; color:white; border:none; padding:10px; border-radius:12px; flex:1; cursor:pointer; font-weight:bold;">قبوڵکردن</button>
        <button onclick="closeNotif()" style="background:#e11d48; color:white; border:none; padding:10px; border-radius:12px; flex:1; cursor:pointer;">✕</button>
    </div>
</div>

<!-- Top Bar -->
<div class="header-bar">
    <div class="header-left-group">
        <div class="settings-btn" onclick="openM('settingsModal')">⚙️</div>
        <button class="friends-toggle-btn" onclick="toggleSidebar()">👥</button>
    </div>
    <div style="font-weight: bold; font-size: 18px; color: var(--led-blue);">GAMES</div>
    <div class="profile-trigger" onclick="openM('profileModal')">
        <span id="topName" style="font-weight: bold; color: var(--led-gold);">...</span>
        <img id="topAvatar" src="" class="user-avatar-top">
    </div>
</div>

<div class="container">
    <div class="welcome-card">
        <h1>بەخێربێن بۆ باڵی هاوڕێیان</h1>
    </div>
    <div class="games-grid">
        <a href="game1-online.html" class="game-card" style="border-color: var(--led-blue); box-shadow: 0 0 15px var(--led-blue);">
            <img src="https://cdn-icons-png.flaticon.com/512/1023/1023656.png" style="width:70px; margin-bottom:10px;">
            <h2>یاری یەکەم</h2>
        </a>
        <a href="game2.html" class="game-card">
            <img src="https://cdn-icons-png.flaticon.com/512/1162/1162251.png" style="width:70px; margin-bottom:10px;">
            <h2>یاری دووەم</h2>
        </a>
    </div>
</div>

<!-- Modals -->
<div id="profileModal" class="modal">
    <div class="modal-content">
        <button style="position:absolute; top:15px; left:15px; color:white; background:none; border:none; font-size:24px; cursor:pointer;" onclick="closeM('profileModal')">✕</button>
        <h2 style="text-align: center; color: var(--led-gold);">پڕۆفایل</h2>
        <div style="text-align: center; margin-bottom: 20px;">
            <img id="midAvatar" src="" style="width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--led-gold);">
            <h3 id="midName" style="color: var(--led-gold); margin-top: 10px;"></h3>
        </div>
        <div class="avatar-grid" id="avGrid"></div>
        <button style="background:none; color:#f87171; border:1px solid #e11d48; padding:12px; border-radius:50px; cursor:pointer; width:100%; font-weight:bold; margin-top:25px;" onclick="logout()">🚪 دەرچوون</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-content" style="border-color: var(--led-blue);">
        <button style="position:absolute; top:15px; left:15px; color:white; background:none; border:none; font-size:24px; cursor:pointer;" onclick="closeM('settingsModal')">✕</button>
        <h2 style="text-align: center; color: var(--led-blue); margin-bottom: 30px;">ڕێکخستنەکان</h2>
        <div style="margin: 20px 0; display: flex; justify-content: space-between; align-items:center;">
            <span>میوزیکی پاشبنەما</span>
            <button id="msBtn" onclick="tglMus()" style="background:#334155; border:none; color:white; padding:8px 20px; border-radius:12px; cursor:pointer; font-weight:bold;">پێکراوە</button>
        </div>
        <div style="margin: 20px 0; display: flex; justify-content: space-between; align-items:center;">
            <span>دەنگی کاریگەری</span>
            <input type="range" id="vSlide" min="0" max="1" step="0.1" onchange="svSet()">
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAVUxyWwAuY_ZnwjFC9WZp1NVp1l815a4c", authDomain: "yari-online.firebaseapp.com", databaseURL: "https://yari-online-default-rtdb.firebaseio.com", projectId: "yari-online", storageBucket: "yari-online.firebasestorage.app", messagingSenderId: "503368361126", appId: "1:503368361126:web:09028d371b17372e320067" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3');
    bgMusic.loop = true;
    let audioStarted = false;

    function initHomeAudio() { if(!audioStarted) { if(localStorage.getItem('music') !== 'off') bgMusic.play(); bgMusic.volume = localStorage.getItem('volume') || 0.5; audioStarted = true; } }
    function tglMus() { let m = localStorage.getItem('music') === 'off' ? 'on' : 'off'; localStorage.setItem('music', m); document.getElementById('msBtn').innerText = m === 'on' ? 'پێکراوە' : 'کوژاوەتەوە'; if(m === 'on') bgMusic.play(); else bgMusic.pause(); }

    let curU = localStorage.getItem('currentUser');
    let curA = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky";
    if(!curU) window.location.href = 'login.html';

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    // ئەوەی داخل بوو، یەکسەر زانیارییەکانی لە فایەربەیس نوێ دەبێتەوە بۆ ئەوەی بدۆزرێتەوە
    function updateOnline() {
        db.ref('users/' + curU).set({ name: curU, avatar: curA, lastSeen: Date.now() });
    }

    async function searchUser() {
        const name = document.getElementById('searchInput').value.trim();
        if(!name || name === curU) return;
        
        // گەڕانێکی وردتر لەناو فایەربەیس
        db.ref('users').orderByChild('name').equalTo(name).once('value', snap => {
            const res = document.getElementById('searchResult');
            if(snap.exists()) {
                const data = snap.val();
                const userId = Object.keys(data)[0];
                const u = data[userId];
                res.innerHTML = `<div class="friend-item"><div><img src="${u.avatar}" class="friend-av">${u.name}</div><button class="search-btn" onclick="sendReq('${u.name}','${u.avatar}')">Add</button></div>`;
            } else {
                res.innerHTML = "<p style='font-size:11px;color:#f87171;text-align:center;'>بۆ ئەوەی هاوڕێکەت بدۆزیتەوە، دەبێت ئەویش لانی کەم یەکجار داخل بووبێت!</p>";
            }
        });
    }

    async function sendReq(target, av) { await db.ref(`requests/${target}/${curU}`).set({ from: curU, avatar: curA }); alert("داواکاری بۆ " + target + " نێردرا!"); document.getElementById('searchResult').innerHTML = ""; }

    function init() {
        document.getElementById('topName').innerText = curU;
        document.getElementById('midName').innerText = curU;
        document.getElementById('topAvatar').src = curA;
        document.getElementById('midAvatar').src = curA;
        updateOnline();

        // Inbox
        db.ref('requests/' + curU).on('value', snap => {
            const d = snap.val(); const list = document.getElementById('requestsList'); list.innerHTML = "";
            if(d) { document.getElementById('requestsArea').style.display = 'block'; for(let id in d) { list.innerHTML += `<div class="friend-item"><span>${id}</span><button class="search-btn" style="background:#10b981;" onclick="acceptReq('${id}','${d[id].avatar}')">✅</button></div>`; } }
            else { document.getElementById('requestsArea').style.display = 'none'; }
        });

        // Friends
        db.ref('friends/' + curU).on('value', snap => {
            const d = snap.val(); const list = document.getElementById('friendsList'); list.innerHTML = "";
            if(d) { for(let id in d) { list.innerHTML += `<div class="friend-item"><div><img src="${d[id].avatar}" class="friend-av">${id}</div><button class="invite-btn" onclick="inviteFriend('${id}')">Invite</button></div>`; } }
            else { list.innerHTML = "<p style='font-size:11px;color:#94a3b8;text-align:center;'>لیستی هاوڕێکانت بەتاڵە</p>"; }
        });

        // Invites
        db.ref('gameInvites/' + curU).on('value', snap => {
            const d = snap.val();
            if(d) {
                document.getElementById('notification').style.display = 'block';
                document.getElementById('notifText').innerHTML = `🎮 <b>${d.from}</b> بانگت دەکات بۆ یاری!`;
                document.getElementById('notifAccept').onclick = () => { db.ref('gameInvites/' + curU).remove(); window.location.href = `game2.html?join=${d.room}`; };
            }
        });

        const g = document.getElementById('avGrid'); g.innerHTML = "";
        for(let i=1; i<=8; i++) {
            let u = `https://api.dicebear.com/7.x/avataaars/svg?seed=Friend${i+800}`;
            let im = document.createElement('img'); im.src = u; im.className = 'avatar-opt' + (u === curA ? ' selected' : '');
            im.onclick = () => { curA = u; localStorage.setItem('userAvatar', u); document.getElementById('topAvatar').src = u; document.getElementById('midAvatar').src = u; updateOnline(); init(); };
            g.appendChild(im);
        }
    }

    async function acceptReq(id, av) { await db.ref(`friends/${curU}/${id}`).set({ avatar: av }); await db.ref(`friends/${id}/${curU}`).set({ avatar: curA }); await db.ref(`requests/${curU}/${id}`).remove(); }
    async function inviteFriend(id) { const rid = Math.random().toString(36).substring(2, 7).toUpperCase(); await db.ref('gameInvites/' + id).set({ from: curU, room: rid }); window.location.href = `game2.html?host=${rid}`; }
    function closeNotif() { db.ref('gameInvites/' + curU).remove(); document.getElementById('notification').style.display = 'none'; }
    function openM(id) { document.getElementById(id).style.display = 'flex'; }
    function closeM(id) { document.getElementById(id).style.display = 'none'; }
    function svSet() { localStorage.setItem('volume', document.getElementById('vSlide').value); bgMusic.volume = document.getElementById('vSlide').value; }
    function logout() { localStorage.removeItem('currentUser'); window.location.href = 'login.html'; }

    const sC = document.getElementById('starsCont');
    for(let i=0;i<100;i++){
        const s=document.createElement('div'); s.className='star';
        let sz=Math.random()*3+1; s.style.width=sz+'px'; s.style.height=sz+'px';
        s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
        s.style.setProperty('--duration', (Math.random()*3+1.5)+'s');
        sC.appendChild(s);
    }
    init();
</script>
</body>
</html>
