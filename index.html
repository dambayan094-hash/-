<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ماڵی هاوڕیان - خومالی</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            font-family: 'Segoe UI', 'Tahoma', sans-serif;
            min-height: 100vh;
            direction: rtl;
            overflow-x: hidden;
        }

        /* ئەستێرەکان */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .moon {
            position: fixed;
            top: 5%;
            right: 5%;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, #fffde7, #fff9c4);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,250,200,0.6);
            z-index: 0;
        }

        /* هێدەر */
        .header-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(11, 17, 32, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(250, 204, 21, 0.3);
        }
        .header-left {
            display: flex;
            gap: 12px;
        }
        .icon-btn {
            background: rgba(255,255,255,0.08);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: #facc15;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-logo {
            font-size: 18px;
            font-weight: bold;
            color: #facc15;
            letter-spacing: 1px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }
        .user-name-top {
            color: #facc15;
            font-weight: bold;
            font-size: 13px;
        }
        .user-avatar-top {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid #facc15;
            background: #1e293b;
        }

        /* سایدبار (هاوڕێکان) */
        #sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100%;
            background: #0f172a;
            z-index: 200;
            transition: 0.3s;
            padding: 20px;
            overflow-y: auto;
            border-left: 2px solid #facc15;
        }
        #sidebar.open {
            right: 0;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .sidebar-header h3 {
            color: #facc15;
        }
        .close-sidebar {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 10px;
            border-radius: 30px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
        }
        .search-box button {
            background: #facc15;
            border: none;
            padding: 0 15px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .friend-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 8px;
        }
        .friend-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .friend-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 1px solid #facc15;
        }
        .friend-name {
            color: white;
        }
        .friend-actions button {
            background: #facc15;
            border: none;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .section-title {
            color: #facc15;
            font-size: 12px;
            margin: 15px 0 10px;
        }

        /* کانتەینەر */
        .main-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 10;
        }

        /* کارتی براند */
        .brand-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 40px 25px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid rgba(250, 204, 21, 0.2);
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
        }
        .brand-name {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #facc15, #ffd966);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
        }
        .brand-sub {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .brand-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, #facc15, transparent);
            margin: 15px auto;
        }
        .brand-tagline {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.8;
        }
        .brand-tagline span {
            color: #facc15;
            font-weight: bold;
        }

        /* یارییەکان */
        .games-title {
            text-align: center;
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .game-item {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            transition: 0.3s;
        }
        .game-item:hover {
            background: rgba(250, 204, 21, 0.1);
            border-color: #facc15;
            transform: translateX(-5px);
        }
        .game-icon {
            width: 40px;
            height: 40px;
            background: rgba(250, 204, 21, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .game-info {
            flex: 1;
        }
        .game-name {
            color: white;
            font-weight: bold;
            font-size: 16px;
        }
        .game-desc {
            color: #94a3b8;
            font-size: 11px;
        }
        .game-arrow {
            color: #facc15;
            font-size: 18px;
        }

        /* مۆدال */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0f172a;
            width: 90%;
            max-width: 350px;
            padding: 25px;
            border-radius: 30px;
            border: 1px solid #facc15;
            text-align: center;
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 20px 0;
        }
        .avatar-opt {
            width: 100%;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .avatar-opt.selected {
            border-color: #facc15;
        }
        .btn-logout {
            background: #e11d48;
            border: none;
            padding: 10px;
            border-radius: 30px;
            color: white;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="stars-container" id="starsCont"></div>
    <div class="moon"></div>

    <div class="header-bar">
        <div class="header-left">
            <button class="icon-btn" onclick="openModal('settingsModal')">⚙️</button>
            <button class="icon-btn" onclick="toggleSidebar()">👥</button>
        </div>
        <div class="header-logo">ماڵی هاوڕیان</div>
        <div class="header-right" onclick="openModal('profileModal')">
            <span class="user-name-top" id="topName">...</span>
            <img id="topAvatar" src="" class="user-avatar-top">
        </div>
    </div>

    <!-- سایدباری هاوڕێکان -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h3>👥 هاوڕێکان</h3>
            <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="گەڕان بە ناوی بەکارهێنەر...">
            <button onclick="searchUser()">🔍</button>
        </div>
        <div id="searchResult"></div>
        <div class="section-title">📨 داواکارییەکان</div>
        <div id="requestsList"></div>
        <div class="section-title">⭐ هاوڕێکانت</div>
        <div id="friendsList"></div>
    </div>

    <div class="main-container">
        <div class="brand-card">
            <div class="brand-name">ماڵی هاوڕیان</div>
            <div class="brand-sub">🏠 خومالی • هاوڕێ و خێزان</div>
            <div class="brand-divider"></div>
            <div class="brand-tagline">
                بەخێربێن بۆ <span>ماڵی هاوڕیان</span><br>
                شوێنی یاری و پێکەوە بوون
            </div>
        </div>

        <div class="games-title">✦ یارییەکان ✦</div>
        <div class="games-grid">
            <a href="game1-online.html" class="game-item">
                <div class="game-icon">🎰</div>
                <div class="game-info">
                    <div class="game-name">یاری یەکەم</div>
                    <div class="game-desc">خولانەوەی بەخت</div>
                </div>
                <div class="game-arrow">›</div>
            </a>
            <a href="game2.html" class="game-item">
                <div class="game-icon">🏆</div>
                <div class="game-info">
                    <div class="game-name">یاری دووەم</div>
                    <div class="game-desc">پێشبڕکێی زیرەکی</div>
                </div>
                <div class="game-arrow">›</div>
            </a>
        </div>
    </div>

    <!-- Modals -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('profileModal')">✕</button>
            <h3 style="color:#facc15; margin-bottom:15px;">پڕۆفایل</h3>
            <img id="midAvatar" src="" style="width:80px; height:80px; border-radius:50%; margin-bottom:10px;">
            <h4 id="midName"></h4>
            <div class="avatar-grid" id="avGrid"></div>
            <button class="btn-logout" onclick="logout()">دەرچوون</button>
        </div>
    </div>

    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('settingsModal')">✕</button>
            <h3 style="color:#facc15;">ڕێکخستنەکان</h3>
            <div style="margin:15px 0; display:flex; justify-content:space-between;">
                <span>میوزیک</span>
                <button id="msBtn" onclick="toggleMusic()" style="background:#334155; border:none; padding:5px 15px; border-radius:20px; color:white;">پێکراوە</button>
            </div>
            <div style="margin:15px 0; display:flex; justify-content:space-between;">
                <span>دەنگ</span>
                <input type="range" id="vSlide" min="0" max="1" step="0.1" onchange="setVolume()">
            </div>
        </div>
    </div>

    <div id="notification" style="position:fixed; bottom:20px; left:20px; background:#1e293b; border:2px solid #facc15; padding:15px; border-radius:20px; z-index:1000; display:none; max-width:280px;">
        <div id="notifText">...</div>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <button id="notifAccept" style="background:#10b981; border:none; padding:8px; border-radius:12px; color:white; flex:1;">قبوڵ</button>
            <button id="notifReject" style="background:#e11d48; border:none; padding:8px; border-radius:12px; color:white;">✕</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAVUxyWwAuY_ZnwjFC9WZp1NVp1l815a4c",
            authDomain: "yari-online.firebaseapp.com",
            databaseURL: "https://yari-online-default-rtdb.firebaseio.com",
            projectId: "yari-online",
            storageBucket: "yari-online.firebasestorage.app",
            messagingSenderId: "503368361126",
            appId: "1:503368361126:web:09028d371b17372e320067"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let curU = localStorage.getItem('currentUser');
        let curA = localStorage.getItem('userAvatar') || "https://api.dicebear.com/7.x/avataaars/svg?seed=Lucky";
        let aStarted = false;
        const bgMusic = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3');
        bgMusic.loop = true;

        if (!curU) window.location.href = 'login.html';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function toggleMusic() {
            let m = localStorage.getItem('music') === 'off' ? 'on' : 'off';
            localStorage.setItem('music', m);
            document.getElementById('msBtn').innerText = m === 'on' ? 'پێکراوە' : 'کوژاوەتەوە';
            if (m === 'on') bgMusic.play(); else bgMusic.pause();
        }
        function setVolume() {
            let v = document.getElementById('vSlide').value;
            localStorage.setItem('volume', v);
            bgMusic.volume = v;
        }
        function logout() {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('userAvatar');
            window.location.href = 'login.html';
        }

        function updateOnline() {
            db.ref('users/' + curU).set({ name: curU, avatar: curA, lastSeen: Date.now() });
        }

        async function searchUser() {
            let name = document.getElementById('searchInput').value.trim();
            if (!name || name === curU) return;
            let resDiv = document.getElementById('searchResult');
            let snapshot = await db.ref('users').orderByChild('name').equalTo(name).once('value');
            if (snapshot.exists()) {
                let data = snapshot.val();
                let userId = Object.keys(data)[0];
                let u = data[userId];
                resDiv.innerHTML = `<div class="friend-item">
                    <div class="friend-info">
                        <img src="${u.avatar}" class="friend-avatar">
                        <span class="friend-name">${u.name}</span>
                    </div>
                    <div class="friend-actions">
                        <button onclick="sendFriendRequest('${u.name}')">➕ زیادکردن</button>
                    </div>
                </div>`;
            } else {
                resDiv.innerHTML = "<p style='color:#f87171; font-size:12px;'>بەکارهێنەر نەدۆزرایەوە</p>";
            }
        }

        async function sendFriendRequest(target) {
            await db.ref(`friendRequests/${target}/${curU}`).set({ from: curU, avatar: curA });
            alert("داواکاری بۆ " + target + " نێردرا!");
            document.getElementById('searchResult').innerHTML = "";
        }

        async function acceptRequest(id, avatar) {
            await db.ref(`friends/${curU}/${id}`).set({ avatar: avatar });
            await db.ref(`friends/${id}/${curU}`).set({ avatar: curA });
            await db.ref(`friendRequests/${curU}/${id}`).remove();
            loadRequests();
            loadFriends();
        }

        async function rejectRequest(id) {
            await db.ref(`friendRequests/${curU}/${id}`).remove();
            loadRequests();
        }

        async function loadRequests() {
            let snap = await db.ref(`friendRequests/${curU}`).once('value');
            let reqs = snap.val();
            let container = document.getElementById('requestsList');
            container.innerHTML = "";
            if (reqs) {
                for (let id in reqs) {
                    container.innerHTML += `<div class="friend-item">
                        <div class="friend-info">
                            <img src="${reqs[id].avatar}" class="friend-avatar">
                            <span class="friend-name">${id}</span>
                        </div>
                        <div class="friend-actions">
                            <button onclick="acceptRequest('${id}','${reqs[id].avatar}')" style="background:#10b981;">✅</button>
                            <button onclick="rejectRequest('${id}')" style="background:#e11d48;">✕</button>
                        </div>
                    </div>`;
                }
            } else {
                container.innerHTML = "<p style='color:#94a3b8; font-size:12px;'>هیچ داواکارییەک نییە</p>";
            }
        }

        async function loadFriends() {
            let snap = await db.ref(`friends/${curU}`).once('value');
            let friends = snap.val();
            let container = document.getElementById('friendsList');
            container.innerHTML = "";
            if (friends) {
                for (let id in friends) {
                    container.innerHTML += `<div class="friend-item">
                        <div class="friend-info">
                            <img src="${friends[id].avatar}" class="friend-avatar">
                            <span class="friend-name">${id}</span>
                        </div>
                        <div class="friend-actions">
                            <button onclick="inviteToGame('${id}')" style="background:#facc15;">🎮 بانگهێشت</button>
                        </div>
                    </div>`;
                }
            } else {
                container.innerHTML = "<p style='color:#94a3b8; font-size:12px;'>هیچ هاوڕێیەک نییە</p>";
            }
        }

        async function inviteToGame(friendId) {
            let roomId = Math.random().toString(36).substring(2, 7).toUpperCase();
            await db.ref(`gameInvites/${friendId}`).set({ from: curU, room: roomId });
            alert("بانگهێشت بۆ " + friendId + " نێردرا!");
        }

        function listenForInvites() {
            db.ref(`gameInvites/${curU}`).on('value', snap => {
                let inv = snap.val();
                if (inv) {
                    document.getElementById('notification').style.display = 'block';
                    document.getElementById('notifText').innerHTML = `🎮 ${inv.from} بانگت دەکات بۆ یاری!`;
                    document.getElementById('notifAccept').onclick = () => {
                        db.ref(`gameInvites/${curU}`).remove();
                        window.location.href = `game2.html?join=${inv.room}`;
                    };
                    document.getElementById('notifReject').onclick = () => {
                        db.ref(`gameInvites/${curU}`).remove();
                        document.getElementById('notification').style.display = 'none';
                    };
                }
            });
        }

        function init() {
            document.getElementById('topName').innerText = curU;
            document.getElementById('midName').innerText = curU;
            document.getElementById('topAvatar').src = curA;
            document.getElementById('midAvatar').src = curA;
            updateOnline();
            loadRequests();
            loadFriends();
            listenForInvites();

            let g = document.getElementById('avGrid');
            for (let i = 1; i <= 8; i++) {
                let u = `https://api.dicebear.com/7.x/avataaars/svg?seed=Av${i + 100}`;
                let img = document.createElement('img');
                img.src = u;
                img.className = 'avatar-opt';
                if (u === curA) img.classList.add('selected');
                img.onclick = () => {
                    localStorage.setItem('userAvatar', u);
                    location.reload();
                };
                g.appendChild(img);
            }

            if (localStorage.getItem('music') !== 'off') bgMusic.play();
            bgMusic.volume = localStorage.getItem('volume') || 0.5;
            document.getElementById('vSlide').value = bgMusic.volume;
        }

        // ئەستێرەکان
        let stars = document.getElementById('starsCont');
        for (let i = 0; i < 100; i++) {
            let s = document.createElement('div');
            s.className = 'star';
            let sz = Math.random() * 3 + 1;
            s.style.width = sz + 'px';
            s.style.height = sz + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            s.style.setProperty('--duration', (Math.random() * 3 + 1.5) + 's');
            stars.appendChild(s);
        }

        init();
    </script>
</body>
</html>
