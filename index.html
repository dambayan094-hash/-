<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    min-height:100vh;
    background:linear-gradient(145deg,#0a0f2e 0%,#0b1120 50%,#000 100%);
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    position:relative;
}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
.star{
    position:absolute;background:#fff;border-radius:50%;
    animation:twinkle 2s infinite;
    opacity:0;
}
@keyframes twinkle{0%{opacity:0;transform:scale(0.5);}50%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(0.5);}}
.moon{
    position:fixed;top:30px;right:30px;width:80px;height:80px;
    background:radial-gradient(circle at 30% 30%,#fffde7,#fff9c4);
    border-radius:50%;box-shadow:0 0 30px rgba(255,250,200,0.8);
    z-index:0;pointer-events:none;animation:moonGlow 4s infinite;
}
@keyframes moonGlow{0%{transform:scale(1);}50%{transform:scale(1.02);}100%{transform:scale(1);}}
.container{
    max-width:650px;width:100%;background:rgba(15,23,42,0.6);
    backdrop-filter:blur(12px);border-radius:48px;padding:35px 30px;
    position:relative;z-index:10;box-shadow:0 25px 45px rgba(0,0,0,0.5);
    text-align:center;
}
.user-info{
    display:flex;justify-content:space-between;align-items:center;
    background:rgba(0,0,0,0.4);border-radius:40px;padding:10px 20px;
    margin-bottom:25px;
}
.user-name{color:#facc15;font-weight:bold;font-size:1rem;}
.logout-btn{background:#dc2626;border:none;border-radius:30px;padding:6px 16px;color:white;cursor:pointer;font-size:0.8rem;}
h1{
    font-size:1.8rem;background:linear-gradient(135deg,#fff,#facc15,#38bdf8);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
}
.sub{color:#94a3b8;margin-bottom:35px;font-size:0.9rem;}
.games-grid{display:flex;flex-direction:column;gap:25px;margin-bottom:30px;}
.game-card{
    background:linear-gradient(145deg,#1e293b,#0f172a);
    border-radius:32px;padding:25px 20px;text-decoration:none;
    display:block;transition:0.3s;border:1px solid rgba(250,204,21,0.2);
}
.game-card:hover{
    transform:translateY(-8px) scale(1.02);
    border-color:#facc15;box-shadow:0 20px 35px rgba(0,0,0,0.4);
}
.game-icon{font-size:3rem;margin-bottom:15px;}
.game-card h2{color:#facc15;font-size:1.5rem;margin-bottom:10px;}
.game-card p{color:#94a3b8;}
.badge{
    display:inline-block;margin-top:12px;background:rgba(250,204,21,0.2);
    padding:5px 15px;border-radius:30px;font-size:0.8rem;color:#facc15;
}
.footer{margin-top:20px;color:#475569;font-size:0.75rem;}
@media (max-width:700px){
    .container{padding:25px 20px;}
    .game-card h2{font-size:1.3rem;}
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="moon"></div>
<div class="container">
    <div class="user-info">
        <span class="user-name" id="userNameDisplay">👤 بارکردن...</span>
        <button class="logout-btn" id="logoutBtn">دەرچوون</button>
    </div>
    
    <h1>ماڵی هاوڕیان 🎮</h1>
    <div class="sub">یارییەکەت هەڵبژێرە</div>
    
    <div class="games-grid">
        <a href="game1-online.html" class="game-card">
            <div class="game-icon">🎰</div>
            <h2>یاری یەکەم</h2>
            <p>خولانەوەی بەخت - ئۆنلاین</p>
            <span class="badge">🌐 ئۆنلاین - لەگەڵ هاوڕێکەت</span>
        </a>
        
        <a href="game2.html" class="game-card">
            <div class="game-icon">🏆</div>
            <h2>یاری دووەم</h2>
            <p>پێشبڕکێی پرسیار - ئۆنلاین</p>
            <span class="badge">🌐 ئۆنلاین - 2 یاریزان</span>
        </a>
    </div>
    
    <div class="footer">✨ هەر کام لە یارییەکان کلیک بکە بۆ ئەوەی بچیتە ناوی ✨</div>
</div>

<script>
const users = {"مەڕوا":"1234","محمد":"1234","ئەشڕەف":"1234","ژوان":"1234"};
function checkLogin(){
    let currentUser = localStorage.getItem('currentUser');
    if(!currentUser || !users[currentUser]) window.location.href = 'login.html';
    return currentUser;
}
let userName = checkLogin();
if(userName) document.getElementById('userNameDisplay').innerHTML = `👤 ${userName}`;
document.getElementById('logoutBtn').addEventListener('click',()=>{
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
});
function genStars(){
    const starCont = document.getElementById('stars');
    for(let i=0;i<160;i++){
        const s=document.createElement('div');s.classList.add('star');
        let sz=Math.random()*3+1;s.style.width=sz+'px';s.style.height=sz+'px';
        s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';
        s.style.animationDelay=Math.random()*5+'s';
        s.style.animationDuration=(Math.random()*3+1.5)+'s';
        if(sz>2) s.style.boxShadow='0 0 4px white';
        starCont.appendChild(s);
    }
}
genStars();
</script>
</body>
</html>
